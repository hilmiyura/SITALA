<div class="row">
  <div class="col-xl-12 col-lg-12 col-md-12">
    <form class="form form-horizontal" method="post">
      <div class="form-group row mb-0">
        <div class="col-md-12">
          <div class="form-group row mb-0">
            <div class="col-md-12 mb-1">
              <input type="text" class="form-control" id="kataKunci" placeholder="Masukan Kata Kunci" value="{$search.keyword}" name="form[keyword]" />
            </div>
            <div class="col-md-3 mb-1">
              <select class="form-control das-filter-src" name="form[uid_das]" id="uid_das_filter">
              </select>
            </div>
            <!-- <div class="col-md-3 mb-1">
              <select class="form-control select2 regional_select2" to="src-provinsi2" name="form[src_reg]">
                <option value=""> --SEMUA REGIONAL-- </option>
                {foreach from=$regional item=i}
                <option value="{$i.kd_regional}" {if $i.kd_regional==$search.src_reg}selected{/if}> {$i.ur_regional}</option>
                {/foreach}
              </select>
            </div> -->
            <div class="col-md-3 mb-1">
              <select class="form-control select2 provinsi_select2" id="src-provinsi2" to="src-kabkota2" name="form[src_prop]">
                <option value=""> --PILIH PROVINSI-- </option>
                {foreach from=$provinsiSelect item=i}
                  <option value="{$i.kd_propinsi}" {if $i.kd_propinsi==$search.src_prop}selected{/if}> {$i.nama_propinsi}</option>
                {/foreach}
              </select>
            </div>
            <div class="col-md-3 mb-1">
              <select class="form-control select2" id="src-kabkota2" name="form[src_kabkota2]">
                <option value="">--PILIH KAB/KOTA--</option>
                {foreach from=$kabkotaSelect item=i}
                  <option value="{$i.kd_kota}" {if $i.kd_kota==$search.src_kabkota2}selected{/if}> {$i.nama_kabkot}</option>
                {/foreach}
              </select>
            </div>
            <div class="col-md-3 mb-1">
              <div class="btn-group btn-block" role="group" aria-label="Basic example">
                <button type="submit" name="search" value="1" class="btn btn-info" style="padding: 10px;">
                  <small><i class="ft-search"></i> SEARCH</small>
                </button>
                <a href="{$baseUrl}{$ctrl}/{$act}" class="btn btn-secondary" style="padding: 10px;">
                  <small><i class="ft-refresh-cw"></i> RESET</small>
                </a>
                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#unduhDataExcel" style="padding: 10px;">
                  <small><i class="ft-download"></i> EXCEL</small>
                </button>
              </div>
            </div>
          </div>
        </div>
        <hr />
      </div>
    </form>
  </div>
</div>
