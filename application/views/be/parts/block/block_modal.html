<div class="modal text-left" id="catatanRekomendasi" role="dialog" aria-labelledby="myModalLabel6" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info bg-darken-2 white">
        <h4 class="modal-title white" id="myModalLabel6">
          <i class="ft-plus-circle"></i> Rekomendasi
        </h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form method="POST" class="form_with_load" action="" enctype="multipart/form-data">
        <div class="modal-body">
          <!-- <h4 class="form-section">
            <i class="la la-map-marker"></i>Rekomendasi
          </h4> -->
          <div class="form-row mb-1">
            <div class="col-md-12 mb-1">
              <label for="name">Isi Rekomendasi *</label>
              <input type="hidden" id="id-pelaporan" name="" value="">
              <textarea name="catatan_rekomendasi" maxlength="700" id="catatan-rekomendasi-txt" class="form-control" rows="8" cols="80"></textarea>
              <small>
                <p id="count-input-rekomendasi" class="mb-0 text-danger"></p>
                <p class="text-danger">*Maksimal 700 karakter</p>
              </small>
            </div>
          </div>
          <div class="form-row mb-1">
            <div class="col-md-12 mb-1">
              <label for="">Rekomendasi Catatan *</label>
              <select class="select2 form-control position-relative" multiple="true" id="catatan-rekomendasi-select" style="width:100%;">
                {foreach from=$rf_catatan item=v}
                <option value="{$v.text}">{$v.text}</option>
                {/foreach}
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a type="button" class="btn grey btn-secondary white" data-dismiss="modal">Close</a>
          <a href="javascript:();" data-toggle="modal" data-target="#catatanRekomendasi" name="submit" class="btn btn-danger simpan-catatan-rekomendasi">Simpan</a>
        </div>
      </form>
    </div>
  </div>
</div>
