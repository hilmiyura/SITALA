<div class="row">
  <div class="col-xl-12 col-lg-12 col-md-12">
    <form class="form form-horizontal" method="post">
      <div class="form-group row mb-0">
        <div class="col-md-12">
          <div class="form-group row mb-0">
            <div class="col-md-5">
              <input type="text" class="form-control mb-1" id="kataKunci" placeholder="Masukan Kata Kunci" value="{$search.keyword}" name="form[keyword]" />
            </div>
            <div class="col-md-2">
              <select class="form-control select2" name="form[role_user]">
                <option value=""  >--ROLE USER/AKSES--</option>
                {if $me.role_user == 0}
                <option value="1" {if $search.role_user == "1"} selected {/if} >PUSAT</option>
                {/if}
                <option value="4" {if $search.role_user == "4"} selected {/if} >REGIONAL</option>
                <option value="2" {if $search.role_user == "2"} selected {/if} >PROVINSI</option>
                <option value="3" {if $search.role_user == "3"} selected {/if} >KABUPATEN/KOTA</option>
                <option value="5" {if $search.role_user == "5"} selected {/if} >PSLH/PPLH</option>
                <option value="6" {if $search.role_user == "6"} selected {/if} >INSPEKTORAT</option>
              </select>
            </div>
            <div class="col-md-5">
              <div class="btn-group btn-block" role="group" aria-label="Basic example">
                <button type="submit" name="search" value="1" class="btn btn-info" style="padding: 10px;">
                  <small><i class="ft-search"></i> SEARCH</small>
                </button>
                <a href="{$baseUrl}{$ctrl}/{$act}" class="btn btn-secondary" style="padding: 10px;">
                  <small><i class="ft-refresh-cw"></i> RESET</small>
                </a>
                {if $act != "verifikasi" && $ctrl != "lokasiPemantauan" && $ctrl != "nilaiDkk" && $ctrl != "targetiklh" && $ctrl != "users" && $ctrl != "ref"}
                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#unduhDataExcel" style="padding: 10px;">
                  <small><i class="ft-download"></i> EXCEL</small>
                </button>
                {/if}
              </div>
            </div>
          </div>
        </div>
      </div>
      <hr />
    </form>
  </div>
</div>
