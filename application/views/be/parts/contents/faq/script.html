	<script type="text/javascript">
		$(document).ready(function(){
			$('.show-datakab').on("click", function(){
				var name = $(this).attr('data-nama');
				var uid = $(this).attr('data-uid');
				var year = $(this).attr('data-year');
				// alert(name);
				$('#body-data').html('<tr><td colspan="6" class="text-center">...wait a moment...</td></tr>');
				$('#data-nama').text(name);
				
				$.ajax({
      				url: baseUrl + ctrl + "/rekapPerKab/prop/"+uid+'/tahun/'+year,
      				method: "GET",
      				success: function(req){
      					console.log(req);
      					$('#body-data').html(req);
      				}
      			});
			});
		})
	</script>
