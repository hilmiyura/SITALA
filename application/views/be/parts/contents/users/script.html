<script type="text/javascript">
	reset = () => {
		$("#uid_users").val("");
		$("#name").val("");
		$("#username").val("");
		$("#role_user").val("").trigger("change");
		$("#active").val("").trigger("change");
		$("#provinsi_user").val("").trigger("change");
		id_kabkota = 0;
		$("#kabkota_user").val("").trigger("change");
	}

	$("#role_user").on("change", function() {
		var attTo = $('option:selected', this).attr('for');
		$(".regionalDiv").hide();
		$(".provinsiDiv").hide();
		$(".provinsilainnyaDiv").hide();
		$(".kabkotaDiv").hide();
		if (attTo == 2) {
			$(".provinsiDiv").show();
		} else if (attTo == 3) {
			$(".provinsiDiv").show();
			$(".kabkotaDiv").show();
		} else if (attTo == 4) {
			$(".provinsiDiv").hide();
			$(".kabkotaDiv").hide();
			$(".regionalDiv").show();
		} else if (attTo == 5) {
			$(".provinsiDiv").hide();
			$(".kabkotaDiv").hide();
			$(".regionalDiv").show();
			$(".provinsilainnyaDiv").show();
		}

	});
	$('#tambahData').on('show.bs.modal', function(event) {
		$(".provinsiDiv").hide();
		$(".provinsilainnyaDiv").hide();
		$(".kabkotaDiv").hide();
		reset();

		var button = $(event.relatedTarget) // Button that triggered the modal
		var userBy = button.data('uid');
		if (userBy) {
			$.ajax({
				url: baseUrl + ctrl + "/editData/x/" + userBy,
				method: "GET",
				success: function(req) {
					if (req.uid_users) {
						$("#uid_users").val(req.uid_users);
						$("#name").val(req.name);
						$("#username").val(req.username);
						$("#password").val(req.password);
						$("#role_user").val(req.role_user).trigger("change");
						$("#active").val(req.active).trigger("change");
						$("#regional_user").val(req.uid_regional).trigger("change");
						setTimeout(function(){
							if(req.uid_provinsi_lainnya){
								$("#provinsi_lainnya_user").val(req.uid_provinsi_lainnya.split(",")).trigger("change");
							}
						},1000);
						$("#provinsi_user").val(req.uid_provinsi).trigger("change");
						id_kabkota = req.uid_kabkota;
						$("#kabkota_user").val(req.uid_kabkota).trigger("change");
						if (role_user == 2) {
							$(".provinsiDiv").show();
						} else if (role_user == 3) {
							$(".provinsiDiv").show();
							$(".kabkotaDiv").show();
						}
					}
				}
			})
		}
	});

	$("#regional_user").on("change", function(){
		var id = $(this).val();
		$.ajax({
			url: baseUrl + 'ajax/provinsiByIdprov/x/'+id,
			type: 'GET',
			contentType: false,
			processData: false,
			success: function(response) {
				var optionS = "<option value='' disabled>--PILIH PROVINSI--</option>";
				if(response.total > 0){
					response.data.forEach((item, i) => {
						optionS += "<option value='"+item.kd_propinsi+"'>"+item.nama_propinsi+"</option>";
					});
				}
				$("#provinsi_lainnya_user").html(optionS);
			}
		});
	})

	$(".onset-file").on("change", function(){
    var file = $(this).prop('files')[0];
		var fd = $(this).attr('fd');
    var tahun = $(this).attr('tahun');
    if(file){
      var formData = new FormData();
      formData.append('file', file);
      $.ajax({
        url: baseUrl + 'users/postLampiran/',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(response) {
          var response = JSON.parse(response);
          if (response.statusCode == 200) {
						setValueDetailProfil(tahun,response.filename,fd,'text');
            let linkDownload = '<a href="'+baseUrl+'uploads/sk_pelaksana/'+response.filename+'" target="_blank" class="btn btn-sm btn-success"><i class="fa fa-download"></i>Download</a>';
            $("#sk_pelaksana_"+tahun).html(linkDownload);
          } else {
            swal("Gagal", "Data gagal disimpan", "error");
          }
          //end
        }
      });
    }
  })

	$(".onset-type").on("focusout", function(){
    var field = $(this).attr("fd");
    var value = $(this).val();
		var tahun   = $(this).attr("tahun");
    var type   = $(this).attr("types");
		setValueDetailProfil(tahun,value,field,type);
  });
  $(".onset-change").on("change", function(){
    var field = $(this).attr("fd");
    var value = $(this).val();
		var tahun   = $(this).attr("tahun");
    var type   = $(this).attr("types");
		setValueDetailProfil(tahun,value,field,type);
  });

	function setValueDetailProfil(tahun,value,field,type){
		var formSubmit = {
      field:field,
      value:value,
			tahun:tahun,
      type:type,
    }
    $.ajax({
      url: baseUrl + 'users/setValueDetail',
      type: 'POST',
      data: formSubmit,
      success: function(response) {
        var res = JSON.parse(response);
        if(res.statusCode == 200){
          toastr.success(res.message, 'Success');
        }else{
          toastr.error(res.message, 'Warning');
        }
      }
    });
	}

	$('#password, #konfirmasi_password').on('keyup', function() {
	  if ($('#password').val() == $('#konfirmasi_password').val()) {
	    $('#message').html('Matching').css('color', 'green');
	    $('#submit').prop('disabled', false);
	  } else {
	    $('#message').html('Not Matching').css('color', 'red');
	    $('#submit').prop('disabled', true);
	  }
	});

	$(".show-pwd").on("click", function(){
		var status = $(this).attr("status");
		if(status == "hide"){
			$("#password").attr("type","text");
			$(".show-pwd").attr("status","show");
			$(".show-pwd-group").addClass("bg-success");
			$(".icon-ft").removeClass("ft-eye-off");
			$(".icon-ft").addClass("ft-eye");
		}else{
			$("#password").attr("type","password");
			$(".show-pwd").attr("status","hide");
			$(".show-pwd-group").removeClass("bg-success");
			$(".icon-ft").removeClass("ft-eye");
			$(".icon-ft").addClass("ft-eye-off");
		}
	})

	$(".show-pwd-confirm").on("click", function(){
		var status = $(this).attr("status");
		if(status == "hide"){
			$("#konfirmasi_password").attr("type","text");
			$(".show-pwd-confirm").attr("status","show");
			$(".show-pwd-confirm-group").addClass("bg-success");
			$(".icon-ft-confirm").removeClass("ft-eye-off");
			$(".icon-ft-confirm").addClass("ft-eye");
		}else{
			$("#konfirmasi_password").attr("type","password");
			$(".show-pwd-confirm").attr("status","hide");
			$(".show-pwd-confirm-group").removeClass("bg-success");
			$(".icon-ft-confirm").removeClass("ft-eye");
			$(".icon-ft-confirm").addClass("ft-eye-off");
		}
	})

</script>
{/literal}
