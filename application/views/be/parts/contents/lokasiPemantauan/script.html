	$('#tambahData').on('show.bs.modal', function(event) {
		reset();
		var button = $(event.relatedTarget) // Button that triggered the modal
		var userBy = button.data('uid');
		if (userBy) {
			$.ajax({
				url: baseUrl + ctrl + "/editData/x/" + userBy,
				method: "GET",
				success: function (req) {
					if (req.uid_lokasi_pemantauan) {
						getListSungai(req.uid_sungai);

						$("#uid_lokasi_pemantauan").val(req.uid_lokasi_pemantauan);
						$("#kode_lokasi").val(req.kode_lokasi);
						$("#alamat").val(req.alamat);
						$("#nama_perusahaan").val(req.nama_perusahaan);
						$("#alamat_detail").val(req.alamat_detail);
						$("#uid_provinsi").val(req.uid_provinsi).trigger("change");
						id_kabkota = req.uid_kabkota;
						$("#uid_kabkota").val(req.uid_kabkota).trigger("change");
						$("#latitude").val(req.latitude);
						$("#longitude").val(req.longitude);
						$("#tahun").val(req.tahun).trigger("change");
						$("#uid_rf_component").val(req.uid_rf_component).trigger("change");
						$("#uid_rf_pelaksana").val(req.uid_rf_pelaksana).trigger("change");
						$("#uid_rf_sumber_pencemar").val(req.uid_rf_sumber_pencemar).trigger("change");
						$("#kategori_pelaporan_ika").val(req.kategori_pelaporan_ika).trigger("change");
						$("#uid_sungai").val(req.uid_sungai).trigger("change");
					}
				}
			})
		}else{
			getListSungai(0);
		}
	});

	function getListSungai(uid_sungai){
		if(uid_sungai){
			$.ajax({
				url: baseUrl + 'ajax/sungai/'+"?i="+uid_sungai,
	      dataType: 'json',
				method: 'GET',
				success:function(data){
					$.each(data, function(index, va) {
						valText = va.text + ' - ' + va.kode_das + ' - ' + va.nama_das+ ' - ' + va.nama_provinsi+ ' - ' + va.nama_kabkota;
						if(va.id == uid_sungai){
							var option = new Option(valText, va.id, true, true);
					    $('#uid_sungai').append(option).trigger('change');
						}
					});

				}
			});
		}

		$('.sungai-src').select2({
	    placeholder: 'Menampilkan 50 data, cari berdasarkan sungai,das,wilayah',
	    allowClear: true,
			delay: 250,
	    ajax: {
	      url: baseUrl + 'ajax/sungai/'+"?i="+uid_sungai,
	      dataType: 'json',
	      processResults: function(data) {
					var results = [];
          var valText = '';
					$.each(data, function(index, va) {
						valText = va.text + ' - DAS : ' + va.nama_das+ ' ('+va.kode_das+') - ' + va.nama_provinsi+ ',' + va.nama_kabkota;
						results.push({
							id: va.id,
							text: valText,
							sungai: va.text
						});
					});
	        return {
	          results: results
	        };
	      }
	    },
			templateResult: function (item) {
        if (!item.id) return item.sungai;
        return $('<span>')
            .text(item.text)
            .attr('sungai', item.sungai);
	    },
	    templateSelection: function (item) {
	        return item.text || item.text;
	    },
			dropdownParent: $('#tambahData'),
	  });
	}

	$("#uid_rf_component").on("change", function(){
		$(".uid_rf_sumber_pencemar").hide();
		$(".kategori_pelaporan_ika").hide();
		$(".uid_sungai").hide();
		var val = $(this).val();
		if(val == 1){
			$(".uid_rf_sumber_pencemar").show();
		}else if (val == 2) {
			$(".kategori_pelaporan_ika").show();
			$(".uid_sungai").show();
		}
	});

	$('#uid_sungai').on('select2:select', function (e) {
    var data = e.params.data;
		let sungai = data.sungai;
		let nama_lokasi = $("#alamat").val();
		if(!nama_lokasi){
			$("#alamat").val(sungai);
		}
	});

	$("#copy-data").on("click", function(){
		var dariTahun = $("#dari-tahun").val();
		var keTahun = $("#ke-tahun").val();
		var komponenPelaporan = $("#komponen-pelaporan").val();

		if(dariTahun > 0 && keTahun > 0 && komponenPelaporan > 0){
			swal({
				title: 'Copy Data',
				text: 'Pastikan data sudah sesuai!',
				type: 'warning',
				showCancelButton: true,
				confirmButtonColor: '#3085d6',
				cancelButtonColor: '#d33',
				confirmButtonText: 'Ya, sudah sesuai!',
				cancelButtonText: 'Batal'
			}).then(function(result) {
				if (result.value) {
					$.ajax({
            url: baseUrl + ctrl + '/copyData/k/'+komponenPelaporan+'/dt/'+dariTahun+'/kt/'+keTahun,
            type: "GET",
            async: false,
            success: function(response) {
							var result = JSON.parse(response);
							console.log(result);
              if (result.statusCode == 200) {
                swal({
                  title: 'Berhasil mengcopy data!',
                  html: '<span class="badge badge-success">' + result.message + '</span>',
                  type: 'success',
                  showConfirmButton: false
                });
              } else {
								swal({
                  title: 'Error copy data!',
                  html: '<span class="badge badge-warning">' + result.message + '</span>',
                  type: 'error',
                  showConfirmButton: false
                });
              }
            }
          });
				}
			}).catch(swal.noop);
		}else{
			swal({
				title: 'Gagal copy data!',
				html: '<span class="badge badge-danger"> Silahkan lengkapi data !</span>',
				type: 'error',
				showConfirmButton: false
			});
		}
	});

	$('.select2').select2({
		dropdownParent: $('#tambahData'),
