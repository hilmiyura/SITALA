{literal}
	<script type="text/javascript">
		reset = ()=>{
			$("#uid_pelaporan_ikeg").val("");
			$("#tanggal").val(nowDate);
			$("#areal_terbakar_fleg").val("");
			$("#areal_terbakar_fbeg").val("");
			$("#non_terbakar_fleg").val("");
			$("#non_terbakar_fbeg").val("");
			$("#kanal_fleg").val("");
			$("#kanal_fbeg").val("");
			$("#non_kanal_fleg").val("");
			$("#non_kanal_fbeg").val("");
			$("#uid_lokasi_pemantauan").val("").trigger("change");
			$("#uid_provinsi").val("").trigger("change");
			id_kabkota = 0;
			$("#uid_kabkota").val("").trigger("change");
		}
		$('#tambahData').on('show.bs.modal', function (event) {
			reset();
			var button = $(event.relatedTarget) // Button that triggered the modal
			var userBy = button.data('uid');
			console.log(baseUrl+ctrl+"/editData/x/"+userBy);
			if(userBy){
				$.ajax({
					url		: baseUrl+ctrl+"/editData/x/"+userBy,
					method	: "GET",
					success	: function(req){
						if(req.uid_pelaporan_ikeg){
							$("#uid_pelaporan_ikeg").val(req.uid_pelaporan_ikeg);
							$("#tanggal").val(req.tanggal);
							$("#areal_terbakar_fleg").val(req.areal_terbakar_fleg);
							$("#areal_terbakar_fbeg").val(req.areal_terbakar_fbeg);
							$("#non_terbakar_fleg").val(req.non_terbakar_fleg);
							$("#non_terbakar_fbeg").val(req.non_terbakar_fbeg);
							$("#kanal_fleg").val(req.kanal_fleg);
							$("#kanal_fbeg").val(req.kanal_fbeg); 
							$("#non_kanal_fleg").val(req.non_kanal_fleg);
							$("#non_kanal_fbeg").val(req.non_kanal_fbeg);
							$("#uid_lokasi_pemantauan").val(req.uid_lokasi_pemantauan).trigger("change");
						}
					}
				})
			}
			
		});
	</script>
{/literal}
