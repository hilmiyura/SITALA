{literal}
	<script type="text/javascript">
		reset = ()=>{
			$("#uid").val("");
			$("#nama").val("");
			$("#kode").val("");
			// $("#uid_kabkota").val("").trigger("change");
		}

		$('#tambahData').on('show.bs.modal', function (event) {
			reset();
			var button = $(event.relatedTarget) // Button that triggered the modal
			var userBy = button.data('uid');
			if(userBy){
				$.ajax({
					url		: baseUrl+ctrl+"/editData/x/"+userBy,
					method	: "GET",
					success	: function(req){
						if(req.uid){
							$("#uid").val(req.uid);
							$("#nama").val(req.nama);
							$("#kode").val(req.kode);
							// $("#uid_kabkota").val(req.uid_provinsi+"-"+req.uid_kabkota).trigger("change");
						}
					}
				});
			}
		});
	</script>
{/literal}
