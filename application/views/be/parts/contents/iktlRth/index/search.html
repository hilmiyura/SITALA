<div class="row">
  <div class="col-xl-12 col-lg-12 col-md-12">
    <form class="form form-horizontal" method="post">
      <div class="form-group row mb-0">
        <div class="col-md-12">
          <div class="form-group row mb-0">
            <div class="col-md-4">
              <input type="text" class="form-control mb-1" id="kataKunci" placeholder="Masukan Kata Kunci" value="{$search.keyword}" name="form[keyword]" />
            </div>
            <div class="col-md-4">
              <select class="form-control select2" name="form[verify]">
                <option value="">--Status Verifikasi--</option>
                <option value="1" {if $search.verify == '1'} selected {/if}>Verified</option>
                <option value="2" {if $search.verify == '2'} selected {/if}>Rejected</option>
              </select>
            </div>
            <div class="col-md-4">
              <select class="form-control select2" name="form[data_sumber]">
                <option value="">--Data--</option>
                <option value="1" {if $search.data_sumber == '1'} selected {/if}>Excel</option>
                <option value="2" {if $search.data_sumber == '2'} selected {/if}>Copy</option>
              </select>
            </div>
            <div class="col-md-4">
              <select class="form-control select2" name="form[jenis_rth]">
                <option value="">--Jenis RTH--</option>
                  {foreach from=$jenisRth item=virth}
                    <option value="{$virth.idx}" {if $virth.idx==$search.jenis_rth} selected {/if}>{$virth.name}</option>
                  {/foreach}
              </select>
            </div>
            <div class="col-md-4">
              <select class="form-control select2" name="form[sumber_dana]">
                <option value="">--Sumber Dana--</option>
                <option value="1" {if $search.sumber_dana=='1' } selected {/if}>APBN</option>
                <option value="2" {if $search.sumber_dana=='2' } selected {/if}>APBD</option>
                <option value="3" {if $search.sumber_dana=='3' } selected {/if}>SWASTA</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-control select2" name="form[order_by]">
                <option value="">--SHORT BY--</option>
                <option value="luas_rth" {if $search.order_by=='luas_rth' } selected {/if} >LUAS RTH</option>
                <option value="jenis_rth" {if $search.order_by=='jenis_rth' } selected {/if} >JENIS RTH</option>
                <option value="nama_rth" {if $search.order_by=='nama_rth' } selected {/if} >NAMA RTH</option>
                <option value="nama_desa" {if $search.order_by=='nama_desa' } selected {/if} >DESA</option>
                <option value="nama_kecamatan" {if $search.order_by=='nama_kecamatan' } selected {/if} >KECAMATAN</option>
              </select>
            </div>
            <div class="col-md-1">
              <select class="form-control select2" name="form[order_type]">
                <option value="ASC" {if $search.order_type=='ASC' } selected {/if}>ASC</option>
                <option value="DESC" {if $search.order_type=='DESC' } selected {/if}>DESC</option>
              </select>
            </div>
          </div>
          <div class="row mt-1">
            <div class="col-md-12">
              <div class="btn-group btn-block" role="group" aria-label="Basic example">
                <button type="submit" name="search" value="1" class="btn btn-info" style="padding: 10px;">
                  <small><i class="ft-search"></i> SEARCH</small>
                </button>
                <a href="{$baseUrl}{$ctrl}/{$act}/x/{$uid_pelaporan_iktl|base64_encode}{if $verif}/verif/1{/if}" class="btn btn-secondary" style="padding: 10px;">
                  <small><i class="ft-refresh-cw"></i> RESET</small>
                </a>
                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#unduhDataExcel" style="padding: 10px;">
                  <small><i class="ft-download"></i> EXCEL</small>
                </button>
              </div>
            </div>
          </div>
        </div>
        <hr />
      </div>
    </form>
  </div>
</div>
