<!-- Modal -->
<div class="modal text-left" id="tambahData2" role="dialog" aria-labelledby="myModalLabel6" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info bg-darken-2 white">
        <h4 class="modal-title white" id="myModalLabel6">
          <i class="ft-plus-circle"></i> Tambah Data FAQ
        </h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form class="form_with_load" method="POST" action="" enctype="multipart/form-data">
        <input type="hidden" name="form[{$primaryKey}]" id="{$primaryKey}" />
        <div class="modal-body">
          <div class="form-row">
            <div class="col-md-6 mb-1">
              <label for="name">Topik</label>
              <select class="select2 form-control position-relative" id="topik" name="form[topik]" style="width: 100%">
                {foreach from=$topik item=v}
                <option value="{$v.uid_topik}">{$v.nama_topik}</option>
                {/foreach}
              </select>
            </div>
          </div>
          <!-- <div class="form-row">
            <div class="col-md-12 mb-1">
              <label for="name">Judul</label>
              <input type="text" class="form-control position-relative" name="form[judul]" id="judul" placeholder="Judul FAQ" value="" required="" />
              <div class="valid-tooltip"></div>
            </div>
          </div> -->
          <div class="form-row">
            <div class="col-md-12 mb-1">
              <label for="name">Pertanyaan</label>
              <textarea class="form-control position-relative" name="form[isi]" id="isi" placeholder="Isi FAQ" required=""></textarea>
              <!-- <div class="valid-tooltip"></div> -->
            </div>
          </div>
          <div class="form-row">
            <div class="col-md-12 mb-1">
              <label for="name">Jawaban</label>
              <textarea class="form-control position-relative" name="form[jawaban]" id="jawaban" placeholder="Jawaban FAQ" required=""></textarea>
              <!-- <div class="valid-tooltip"></div> -->
            </div>
          </div>
          <div class="form-row">
            <div class="col-md-6 mb-1">
              <label for="name">Lampiran</label>
              <input type="file" class="form-control position-relative" name="lampiran" id="lampiran" placeholder="" value="" />
              <div id="btn-lampiran" class="mt-1"></div>
            </div>
            <div class="col-md-6 mb-1">
              <label for="name">Publish</label>
              <select class="select2 form-control position-relative" id="status" name="form[status]" style="width: 100%">
                <option value="1">Ya</option>
                <option value="2">Tidak</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a type="button" class="btn grey btn-secondary white" data-dismiss="modal">Close</a>
          <button type="submit" name="submit" class="btn btn-danger">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
