{literal}
<script type="text/javascript">
	var scrollTobtn = '{/literal}{$scrollTobtn}{literal}';
	var currentDocBlobUrl = null;
	var ocrOptions = [];
	var ocrMode = null; //null|"single"|"all"

	function renderDocPreview(url, isPdf) {
		$("#doc-preview-empty").hide();
		$("#doc-preview-wrapper").show();
		if (isPdf) {
			$("#doc-preview").html('<iframe src="' + url + '"></iframe>');
		} else {
			$("#doc-preview").html('<img src="' + url + '">');
		}
	}

	function clearDocPreview() {
		if (currentDocBlobUrl) {
			URL.revokeObjectURL(currentDocBlobUrl);
			currentDocBlobUrl = null;
		}
		$("#doc-preview").html("");
		$("#doc-preview-wrapper").hide();
		$("#doc-preview-empty").show();
	}

	function showDropzoneFile(name) {
		$("#ocr-dropzone").addClass("has-file");
		$("#ocr-dropzone-placeholder").hide();
		$("#ocr-dropzone-filename").text(name);
		$("#ocr-dropzone-selected").show();
	}

	function resetDropzone() {
		$("#ocr-dropzone").removeClass("has-file dragover");
		$("#ocr-dropzone-selected").hide();
		$("#ocr-dropzone-placeholder").show();
	}

	$(document).on("dragover", "#ocr-dropzone", function(e) {
		e.preventDefault();
		e.stopPropagation();
		$(this).addClass("dragover");
	});

	$(document).on("dragleave", "#ocr-dropzone", function(e) {
		e.preventDefault();
		e.stopPropagation();
		$(this).removeClass("dragover");
	});

	$(document).on("drop", "#ocr-dropzone", function(e) {
		e.preventDefault();
		e.stopPropagation();
		$(this).removeClass("dragover");
		var files = e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files;
		if (files && files.length) {
			$("#shu")[0].files = files;
			$("#shu").trigger("change");
		}
	});

	$(document).ready(function() {
		// insert container validasi lokasi sebelum section Pemantauan di #iku-single-block
		$('<div id="location-validation-result" style="display:none;"></div>')
			.insertBefore("#iku-single-block h4.form-section:has(.ft-edit)");

		$('#primary').on('show.bs.modal', function(event) {
			$(".select-year-indeks").val("").trigger("change");
			$(".simulasi-content").html("");
		});

		$(document).on("click", "#btn-hitung-simulasi-kabkota", function(event) {
			var uid = $(this).attr("data-uid");
			var year = $(this).attr("data-year");
			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKU/hitungKabkota/x/" + uid + "/y/" + year,
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							if (res.data) {
								if(year <= 2024){
									var indeksIku = (res.data.indeksIku > 100 ? 100 : res.data.indeksIku.toFixed(2));
									$(".rpp-no2-" + uid + "-kabkota").html(res.data.rpp.no2.toFixed(2));
									$(".rpp-so2-" + uid + "-kabkota").html(res.data.rpp.so2.toFixed(2));
									$(".idbm-no2-" + uid + "-kabkota").html(res.data.idbm.no2.toFixed(2));
									$(".idbm-so2-" + uid + "-kabkota").html(res.data.idbm.so2.toFixed(2));
									$(".rataan-indeks-" + uid + "-kabkota").html(res.data.rataanIndeks.toFixed(2));
									$(".iku-" + uid + "-kabkota").html(indeksIku);
								}else if (year <= 2025) {
									var indeksIkuIna = (res.data.indeksIkuIna > 100 ? 100 : res.data.indeksIkuIna.toFixed(2));
									$(".rpp-no2-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.no2?.rataan_konsentrasi?.toFixed(2));
									$(".rpp-so2-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.so2?.rataan_konsentrasi?.toFixed(2));
									$(".rpp-pm25-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.pm25?.rataan_konsentrasi?.toFixed(2));
									$(".idbm-no2-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.no2?.indeks_konsentrasi?.toFixed(2));
									$(".idbm-so2-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.so2?.indeks_konsentrasi?.toFixed(2));
									$(".idbm-pm25-" + uid + "-kabkota").html(res.data?.indeksIkuInaDetail?.pm25?.indeks_konsentrasi?.toFixed(2));
									$(".rataan-indeks-" + uid + "-kabkota").html(res.data?.rataanIndeksIna.toFixed(2));
									$(".iku-ina-" + uid + "-kabkota").html(indeksIkuIna);
								}
							}
						}
					}
				});
			}
		});

		$(document).on("click", "#btn-hitung-simulasi-prov", function(event) {
			var uid = $(this).attr("data-uid");
			var year = $(this).attr("data-year");

			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKU/hitungProv/x/" + uid,
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							if (res.data) {
								if(year <= 2024){
									var indeksIku = (res.data.indeksIku > 100 ? 100 : res.data.indeksIku.toFixed(2));
									$(".rpp-no2-" + uid + "-prov").html(res.data.rpp.no2.toFixed(2));
									$(".rpp-so2-" + uid + "-prov").html(res.data.rpp.so2.toFixed(2));
									$(".idbm-no2-" + uid + "-prov").html(res.data.idbm.no2.toFixed(2));
									$(".idbm-so2-" + uid + "-prov").html(res.data.idbm.so2.toFixed(2));
									$(".rataan-indeks-" + uid + "-prov").html(res.data.rataanIndeks.toFixed(2));
									$(".iku-" + uid + "-prov").html(indeksIku);
								}else if (year <= 2025) {
									var indeksIkuIna = (res.data.indeksIkuIna > 100 ? 100 : res.data.indeksIkuIna.toFixed(2));
									$(".rpp-no2-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.no2?.rataan_konsentrasi?.toFixed(2));
									$(".rpp-so2-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.so2?.rataan_konsentrasi?.toFixed(2));
									$(".rpp-pm25-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.pm25?.rataan_konsentrasi?.toFixed(2));
									$(".idbm-no2-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.no2?.indeks_konsentrasi?.toFixed(2));
									$(".idbm-so2-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.so2?.indeks_konsentrasi?.toFixed(2));
									$(".idbm-pm25-" + uid + "-prov").html(res.data?.indeksIkuInaDetail?.pm25?.indeks_konsentrasi?.toFixed(2));
									$(".rataan-indeks-" + uid + "-prov").html(res.data?.rataanIndeksIna.toFixed(2));
									$(".iku-ina-" + uid + "-prov").html(indeksIkuIna);
								}
							}
						}
					}
				});
			}
		});

		$(document).on("click", "#btn-hitung-simulasi-nasional", function(event) {
			var uid = $(this).attr("data-uid");
			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKU/hitungNasional/x/" + uid,
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							$(".iku-" + uid + "-nasional").html((res.data ? res.data.toFixed(2) : "--"));
						}
					}
				});
			}
		});

		$(".select-year-indeks").on("change", function() {
			var year = $(this).val();
			if (year != "") {
				$.ajax({
					url: baseUrl + "simulasiHitungIKU/getDataIndeks/x/" + year,
					method: "GET",
					success: function(req) {
						var res = JSON.parse(req);
						if (res.statusCode == 200) {
							var data = res;
							if (data) {
								$(".simulasi-content").html(data.html);
							}
						}
					}
				});
			}
		});

		setTimeout(function() {
			window.scrollTo(0, scrollTobtn);
		}, 1500);
	});
	reset = () => {
		$("#uid_pelaporan_iku").val("");
		$("#tanggal").val("");
		$('input[name="form[tanggal]_submit"]').attr('value', "");
		$("#durasi_pemantauan").val("");
		$("#periode_pemantauan").val("").trigger("change");
		$("#no2").val("");
		$("#no2_uid_metode_pemantauan").val("").trigger("change");
		$("#no2_durasi_pemantauan").val("").trigger("change");
		$("#no2_faktor_koreksi").val("");
		$("#no2-dp-manual-aktif").hide();
		$("#no2-dp-pasif").hide();
		$("#no2-faktor-koreksi").hide();
		$("#so2").val("");
		$("#so2_uid_metode_pemantauan").val("").trigger("change");
		$("#so2_durasi_pemantauan").val("").trigger("change");
		$("#so2_faktor_koreksi").val("");
		$("#so2-dp-manual-aktif").hide();
		$("#so2-dp-pasif").hide();
		$("#so2-faktor-koreksi").hide();
		$("#pm25").val("");
		$("#pm25_uid_metode_pemantauan").val("").trigger("change");
		$("#pm25_durasi_pemantauan").val("").trigger("change");
		$("#pm25_faktor_koreksi").val("");
		$("#pm25-dp-manual-aktif").hide();
		$("#pm25-dp-pasif").hide();
		$("#pm25-faktor-koreksi").hide();
		$("#pm25-info-msg").hide().html("");
		$(".durasi-pasif-warning").hide().text("");
		$("#catatan-ocr-panel").hide();
		$("#catatan-ocr-body").html("");
		$("#location-validation-result").hide().html("").removeClass("alert alert-success alert-warning alert-danger");
		$("#alamat").val("");
		$("#alamat_detail").val("");
		$("#latitude").val("");
		$("#longitude").val("");
		$("#uid_lokasi_pemantauan").val("").trigger("change");
		$("#uid_rf_peruntukan").val("").trigger("change");
		$("#uid_metode_pemantauan").val("").trigger("change");
		$("#uid_provinsi").val("").trigger("change");
		id_kabkota = "";
		id_provinsi = "";
		$("#uid_kabkota").val("").trigger("change");
		$(".shu-download").hide();
		$("#uid_lab").val("").trigger("change");
		$("#shu").val("");
		$("#ocr_result_payload").val("");
		$("#ocr-status").hide().html("");
		ocrOptions = [];
		ocrMode = null;
		$("#ocr-multi-panel").hide();
		$("#ocr-lokasi-picker").html('<option value="">--PILIH LOKASI--</option><option value="all">PILIH SEMUA</option>');
		$("#iku-repeater-rows").hide().empty();
		$("#iku-single-block").show();
		$("#btn-simpan-iku").prop("disabled", false).text("Simpan");
		$("#jenis-dokumen-manual").prop("checked", true);
		clearDocPreview();
		resetDropzone();
	}

	function setOcrStatus(type, html) {
		$("#ocr-status")
			.removeClass("alert-info alert-success alert-warning alert-danger")
			.addClass("alert-" + type)
			.html(html)
			.show();
	}

	//===== Validasi pergeseran koordinat lokasi =====
	function showLocationValidation(result, $container) {
		$container = $container || $("#location-validation-result");
		if (!result || !result.data) {
			$container.hide().html("");
			return;
		}
		var status = result.data.status;
		var styleMap = {
			ok:      { cls: "alert-success", icon: "ft-check-circle" },
			warn:    { cls: "alert-warning",  icon: "ft-alert-triangle" },
			invalid: { cls: "alert-danger",   icon: "ft-alert-octagon" }
		};
		var s = styleMap[status] || styleMap["warn"];
		$container.removeClass("alert-success alert-warning alert-danger")
			.addClass("alert " + s.cls)
			.html('<i class="' + s.icon + '"></i> ' + result.message)
			.show();
	}

	function validateLocation(uid, latitude, longitude, $container) {
		$container = $container || $("#location-validation-result");
		if (!uid || latitude == null || longitude == null) {
			$container.hide().html("").removeClass("alert alert-success alert-warning alert-danger");
			return;
		}
		$.ajax({
			url: baseUrl + "utils/validateLocationPelaporan",
			method: "POST",
			data: JSON.stringify({ uid_lokasi_pemantauan: parseInt(uid), latitude: parseFloat(latitude), longitude: parseFloat(longitude) }),
			contentType: "application/json",
			success: function(res) {
				try { res = (typeof res === "string") ? JSON.parse(res) : res; } catch(e) {}
				showLocationValidation(res, $container);
			}
		});
	}

	//===== Kriteria: durasi pemantauan Manual Pasif harus 13/14/15 hari =====
	var METODE_MANUAL_PASIF = 2;
	var METODE_MANUAL_AKTIF = 1;
	var METODE_SATELIT = 17;
	var DURASI_PASIF_ALLOWED_DAYS = [13, 14, 15];

	function checkDurasiPasif(param, sfx) {
		sfx = sfx || "";
		var $warn = $("#" + param + "-durasi-pasif-warning" + sfx);
		var metodeId = $("#" + param + "_uid_metode_pemantauan" + sfx).val();
		if (metodeId != METODE_MANUAL_PASIF) {
			$warn.hide().text("");
			return;
		}
		var val = parseInt($("#" + param + "_durasi_pemantauan_pasif" + sfx).val(), 10);
		if (!val) {
			$warn.hide().text("");
			return;
		}
		if (DURASI_PASIF_ALLOWED_DAYS.indexOf(val) === -1) {
			$warn.text("Pemantauan Manual Pasif idealnya berlangsung 13-15 hari (saat ini " + val + " hari).").show();
		} else {
			$warn.hide().text("");
		}
	}

	$(document).on("input change", ".durasi-pasif-input", function() {
		var param = $(this).data("param");
		var sfx = this.id.replace(param + "_durasi_pemantauan_pasif", "");
		checkDurasiPasif(param, sfx);
	});

	function showPm25Msg(msg, type, sfx) {
		sfx = sfx || "";
		var $el = $("#pm25-info-msg" + sfx);
		if (!msg) {
			$el.hide().html("");
			return;
		}
		var iconMap = { info: "ft-info", success: "ft-check-circle", warning: "ft-alert-triangle", danger: "ft-alert-octagon" };
		$el.removeClass("alert-info alert-success alert-warning alert-danger")
			.addClass("alert alert-" + type)
			.html('<i class="' + (iconMap[type] || "ft-info") + '"></i> ' + msg)
			.show();
	}

	function checkAndFillPm25(data, lokasiRow, sfx, source) {
		sfx = sfx || "";
		var params = data.parameters || {};
		var pm25 = params.pm25 || {};
		var no2 = params.no2 || {};
		var so2 = params.so2 || {};

		var pm25Nilai = pm25.nilai;
		var no2MetodeUid = no2.metode && no2.metode.uid;
		var so2MetodeUid = so2.metode && so2.metode.uid;

		var bothPasif = (no2MetodeUid == METODE_MANUAL_PASIF && so2MetodeUid == METODE_MANUAL_PASIF);
		var bothAktif = (no2MetodeUid == METODE_MANUAL_AKTIF && so2MetodeUid == METODE_MANUAL_AKTIF);

		if (pm25Nilai === null || pm25Nilai === undefined || pm25Nilai === "") {
			if (bothPasif) {
				// Kondisi 1: NO2 & SO2 pasif, PM2.5 tidak ada → ambil dari data satelit
				if (lokasiRow && lokasiRow.uid_provinsi && lokasiRow.uid_kabkota && data.tanggal) {
					var tahun = String(data.tanggal).substring(0, 4);
					showPm25Msg("Mengambil data PM2.5 satelit...", "info", sfx);
					$.ajax({
						url: baseUrl + "iku/pm25Satelit/x/" + lokasiRow.uid_provinsi + "/y/" + lokasiRow.uid_kabkota + "/z/" + tahun,
						method: "GET",
						success: function(res) {
							try { res = (typeof res === "string") ? JSON.parse(res) : res; } catch(e) {}
							if (res.statusCode == 200 && res.data && res.data.iku_pm25_satelit != null) {
								$("#pm25" + sfx).val(res.data.iku_pm25_satelit);
								$("#pm25_uid_metode_pemantauan" + sfx).val(METODE_SATELIT).trigger("change");
								showPm25Msg(
									"PM2.5 diisi otomatis dari data satelit (" + res.data.iku_pm25_satelit + " µg/m³) karena NO2 dan SO2 menggunakan metode manual pasif.",
									"info", sfx
								);
							} else {
								showPm25Msg(
									"Data PM2.5 satelit tidak tersedia untuk lokasi dan tahun ini. Isi PM2.5 secara manual.",
									"warning", sfx
								);
							}
						},
						error: function() {
							showPm25Msg("Gagal mengambil data PM2.5 satelit. Isi PM2.5 secara manual.", "warning", sfx);
						}
					});
				} else {
					showPm25Msg(
						"NO2 dan SO2 menggunakan metode manual pasif, PM2.5 perlu diambil dari data satelit. Pilih lokasi terlebih dahulu.",
						"warning", sfx
					);
				}
			} else if (bothAktif) {
				// Kondisi 3: NO2 & SO2 aktif tapi PM2.5 tidak ada
				showPm25Msg(
					"NO2 dan SO2 menggunakan metode manual aktif. PM2.5 harus tersedia — nilai tidak ditemukan di dokumen. Isi PM2.5 secara manual.",
					"danger", sfx
				);
			} else if (source === "aqms") {
				// Kondisi 4: AQMS flow, PM2.5 tidak ada di dokumen
				showPm25Msg(
					"Data PM2.5 tidak ditemukan di dokumen AQMS. Isi PM2.5 secara manual.",
					"warning", sfx
				);
			}
		} else {
			if (bothPasif) {
				// Kondisi 2: NO2 & SO2 pasif, PM2.5 ada di OCR → paksa metode manual aktif
				$("#pm25_uid_metode_pemantauan" + sfx).val(METODE_MANUAL_AKTIF).trigger("change");
				showPm25Msg(
					"NO2 dan SO2 menggunakan metode manual pasif, namun PM2.5 ditemukan di dokumen. Metode PM2.5 diset ke Manual Aktif.",
					"info", sfx
				);
			}
		}
	}

	//sfx = "" for the single/default fields, "_r0", "_r1", ... for cloned repeater rows
	function applyOcrResult(data, opts) {
		opts = opts || {};
		var sfx = opts.suffix || "";
		var done = opts.done;
		var source = opts.source || "manual";
		var unmatched = [];

		var hasLokasiUid = !!(data.lokasi && data.lokasi.uid);

		var lokasiDone = function() {
			if (typeof done === "function") {
				done();
			}
		};

		if (hasLokasiUid) {
			$.ajax({
				url: baseUrl + "ajax/lokasiById/x/" + data.lokasi.uid,
				method: "GET",
				success: function(r) {
					var htmls = "<option value=''>--PILIH LOKASI PEMANTAUAN--</option>";
					var capturedVal = null;
					if (r.total) {
						jQuery.each(r.data, function(i, val) {
							capturedVal = val;
							htmls += "<option value='" + val.uid_lokasi_pemantauan + "' selected>" + val.kode_lokasi + " - " + val.alamat + " - " + val.alamat_detail + "</option>";
							$("#alamat" + sfx).val(val.alamat);
							$("#alamat_detail" + sfx).val(val.alamat_detail);
							$("#latitude" + sfx).val(val.latitude);
							$("#longitude" + sfx).val(val.longitude);
							if (!sfx) {
								setTimeout(function() {
									id_kabkota = val.uid_kabkota;
									$("#uid_provinsi").val(val.uid_provinsi).trigger("change");
									$("#uid_kabkota").val(val.uid_kabkota).trigger("change");
								}, 1000);
							}
						});
					}
					$("#uid_lokasi_pemantauan" + sfx).html(htmls);
					if (!sfx && data.latitude && data.longitude) {
						validateLocation(data.lokasi.uid, data.latitude, data.longitude);
					} else if (!sfx && source === "aqms" && capturedVal) {
						var $locVal = $("#location-validation-result");
						$locVal.removeClass("alert alert-success alert-warning alert-danger")
							.addClass("alert alert-info")
							.html('<i class="ft-info"></i> Lokasi dicocokkan berdasarkan nama stasiun AQMS.')
							.show();
					}
					checkAndFillPm25(data, capturedVal, sfx, source);
					lokasiDone();
				},
				error: function() {
					checkAndFillPm25(data, null, sfx, source);
					lokasiDone();
				}
			});
		} else {
			if (data.lokasi && data.lokasi.text) {
				unmatched.push("Lokasi Pemantauan (\"" + data.lokasi.text + "\")");
			}
		}

		if (data.peruntukan && data.peruntukan.uid) {
			$("#uid_rf_peruntukan" + sfx).val(data.peruntukan.uid).trigger("change");
		} else if (data.peruntukan && data.peruntukan.text) {
			unmatched.push("Peruntukan (\"" + data.peruntukan.text + "\")");
		}

		var labelMap = { no2: "NO2", so2: "SO2", pm25: "PM2.5" };
		var params = data.parameters || {};
		jQuery.each(["no2", "so2", "pm25"], function(i, param) {
			var p = params[param];
			if (!p) {
				return;
			}
			if (p.nilai !== null && p.nilai !== undefined) {
				$("#" + param + sfx).val(p.nilai);
			}
			if (p.metode && p.metode.uid) {
				$("#" + param + "_uid_metode_pemantauan" + sfx).val(p.metode.uid).trigger("change");
				if (p.metode.uid == 1) {
					if (p.durasi_pemantauan) {
						$("#" + param + "_durasi_pemantauan" + sfx).val(p.durasi_pemantauan).trigger("change");
					}
				} else if (p.durasi_pemantauan) {
					$("#" + param + "_durasi_pemantauan_pasif" + sfx).val(p.durasi_pemantauan);
				}
				checkDurasiPasif(param, sfx);
			} else if (p.metode && p.metode.text) {
				unmatched.push("Metode " + labelMap[param] + " (\"" + p.metode.text + "\")");
			}
		});

		// For the no-lokasi-uid case, params loop has now run so PM2.5 check is safe
		if (!hasLokasiUid) {
			checkAndFillPm25(data, null, sfx, source);
			lokasiDone();
		}

		return unmatched;
	}

	//tanggal/periode/lab are document-level (identical for every location in the same OCR result)
	function applySharedFields(data) {
		if (data.tanggal) {
			$("#tanggal").val(data.tanggal).trigger("change");
			$('input[name="form[tanggal]_submit"]').val(data.tanggal);
		}
		if (data.periode_pemantauan) {
			$("#periode_pemantauan").val(data.periode_pemantauan).trigger("change");
		}
		//data.lab untuk IKU berupa ARRAY sejak OCR menggabungkan sertifikat dari beberapa
		//lab untuk satu lokasi — sejalan dengan #uid_lab yang memang multi-select dan
		//kolom pelaporan_iku.uid_lab yang disimpan sebagai CSV.
		//
		//Bentuk objek tunggal tetap diterima: respons IKA/IKAL masih memakainya, dan
		//hasil OCR lama yang tersimpan di ocr_result juga berbentuk itu.
		var labs = [];
		if (data.lab) {
			labs = $.isArray(data.lab) ? data.lab : [data.lab];
		}
		var labUids = [];
		$.each(labs, function(i, l) {
			//lab yang tidak ketemu di rf_lab tetap dikirim dengan uid null — dilewati
			//di sini, tapi sengaja tetap ada di respons supaya bisa ditampilkan sebagai
			//catatan "tidak dikenali" seperti field lain
			if (l && l.uid) {
				labUids.push(String(l.uid));
			}
		});
		if (labUids.length) {
			$("#uid_lab").val(labUids).trigger("change");
		}
	}

	//clone the <template>, suffix every id/for/to with _r{idx} so it can coexist with the single block
	function cloneIkuRowTemplate(idx) {
		var tpl = document.getElementById("iku-row-template");
		var sfx = "_r" + idx;
		var $wrap = $("<div>").append(tpl.content.cloneNode(true));

		$wrap.find("[id]").each(function() {
			this.id = this.id + sfx;
		});
		$wrap.find("[for]").each(function() {
			$(this).attr("for", $(this).attr("for") + sfx);
		});
		$wrap.find("[to]").each(function() {
			$(this).attr("to", $(this).attr("to") + sfx);
		});

		return $wrap.children();
	}

	function renderIkuRepeaterRows() {
		$("#iku-repeater-rows").empty();
		jQuery.each(ocrOptions, function(idx, opt) {
			var sfx = "_r" + idx;
			var $content = cloneIkuRowTemplate(idx);
			var $row = $('<div class="iku-row" data-idx="' + idx + '"></div>');
			var $header = $(
				'<div class="iku-row-header">'
				+ '<p class="iku-row-title">Lokasi ' + (idx + 1) + ': ' + (opt.label || "-") + '</p>'
				+ '<span class="iku-row-remove">Hapus dari batch</span>'
				+ '</div>'
			);
			$row.append($header).append($content);
			$("#iku-repeater-rows").append($row);

			// insert validation container per-row sebelum section Pemantauan
			var $validRow = $('<div class="location-validation-result-row mb-2" style="display:none;"></div>');
			$row.find("h4.form-section").filter(function() {
				return $(this).find(".ft-edit").length > 0;
			}).before($validRow);

			// validasi koordinat OCR awal untuk row ini
			if (opt.lokasi && opt.lokasi.uid && opt.latitude != null && opt.longitude != null) {
				validateLocation(opt.lokasi.uid, opt.latitude, opt.longitude, $validRow);
			}

			$row.find(".select2").each(function() {
				$(this).select2({ dropdownParent: $(this).parent() });
			});

			$("#uid_lokasi_pemantauan" + sfx).on("change", function() {
				var valId = $(this).val();
				if (!valId) {
					$("#alamat" + sfx).val("");
					$("#alamat_detail" + sfx).val("");
					$("#latitude" + sfx).val("");
					$("#longitude" + sfx).val("");
					$validRow.hide().html("").removeClass("alert alert-success alert-warning alert-danger");
					return;
				}
				$.ajax({
					url: baseUrl + "ajax/lokasiById/x/" + valId,
					method: "GET",
					success: function(req) {
						if (req.total) {
							jQuery.each(req.data, function(i, val) {
								$("#alamat" + sfx).val(val.alamat);
								$("#alamat_detail" + sfx).val(val.alamat_detail);
								$("#latitude" + sfx).val(val.latitude);
								$("#longitude" + sfx).val(val.longitude);
							});
						}
						// clear validasi saat user ganti lokasi manual (tidak ada koordinat OCR lagi)
						$validRow.hide().html("").removeClass("alert alert-success alert-warning alert-danger");
					}
				});
			});

			jQuery.each(["no2", "so2", "pm25"], function(i, param) {
				//cloned rows start from the template's raw (all-visible) markup, so force the
				//same default state reset() gives the single block before OCR data can override it
				toggleDurasiPemantauan(param, sfx, "");
				$("#" + param + "-faktor-koreksi" + sfx).hide();
				$("#" + param + "_uid_metode_pemantauan" + sfx).on("change", function() {
					toggleDurasiPemantauan(param, sfx, $(this).val());
					checkDurasiPasif(param, sfx);
				});
			});

			applyOcrResult(opt, { suffix: sfx });

			$row.find(".iku-row-remove").on("click", function() {
				$row.remove();
			});
		});
	}

	$(document).on("change", "#ocr-lokasi-picker", function() {

		} else if (val !== "" && ocrOptions[val]) {
			ocrMode = "single";
			$("#iku-repeater-rows").hide().empty();
			$("#iku-single-block").show();
			$("#ocr_result_payload").val(JSON.stringify(ocrOptions[val]));
			var unmatched = applyOcrResult(ocrOptions[val]);
			var msg = "Lokasi \"" + (ocrOptions[val].label || "") + "\" diisikan ke form. Lokasi Pemantauan tetap bisa diganti manual di bawah.";
			if (unmatched.length) {
				setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
			} else {
				setOcrStatus("success", msg);
			}
		} else {
			ocrMode = null;
			$("#iku-repeater-rows").hide().empty();
			$("#iku-single-block").show();
		}
	});

	$(document).on("submit", "#tambahData form", function(event) {
		if (ocrMode !== "all") {
			return;
		}
		var $rows = $("#iku-repeater-rows .iku-row");
		if (!$rows.length) {
			return;
		}
		event.preventDefault();

		var formEl = this;
		var total = $rows.length;
		var processed = 0;

		$("#btn-simpan-iku").prop("disabled", true);

		function buildRowFormData(idx) {
			var sfx = "_r" + idx;
			var fd = new FormData(formEl);
			fd.set("submit", "1");
			//.set() replaces whatever the (hidden) single block's same-named fields captured
			fd.set("form[ocr_result]", JSON.stringify(ocrOptions[idx] || {}));
			fd.set("form[uid_lokasi_pemantauan]", $("#uid_lokasi_pemantauan" + sfx).val() || "");
			fd.set("form[uid_rf_peruntukan]", $("#uid_rf_peruntukan" + sfx).val() || "");
			jQuery.each(["no2", "so2", "pm25"], function(i, param) {
				fd.set("form[" + param + "]", $("#" + param + sfx).val() || "");
				fd.set("form[" + param + "_uid_metode_pemantauan]", $("#" + param + "_uid_metode_pemantauan" + sfx).val() || "");
				fd.set("form[" + param + "_durasi_pemantauan]", $("#" + param + "_durasi_pemantauan" + sfx).val() || "");
				fd.set("form[" + param + "_durasi_pemantauan_pasif]", $("#" + param + "_durasi_pemantauan_pasif" + sfx).val() || "");
			});
			return fd;
		}

		function submitNext(i) {
			if (i >= $rows.length) {
				setOcrStatus("success", "Selesai memproses " + processed + " dari " + total + " lokasi. Halaman akan dimuat ulang...");
				setTimeout(function() {
					location.reload();
				}, 800);
				return;
			}
			var idx = $($rows.get(i)).data("idx");
			$("#btn-simpan-iku").text("Menyimpan " + (i + 1) + "/" + total + "...");
			$.ajax({
				url: baseUrl + ctrl,
				method: "POST",
				data: buildRowFormData(idx),
				processData: false,
				contentType: false,
				complete: function() {
					processed++;
					submitNext(i + 1);
				}
			});
		}

		submitNext(0);
	});

	$(document).on("change", "#shu", function(e) {
		var file = e.target.files && e.target.files[0];
		if (!file) {
			$("#ocr-status").hide().html("");
			return;
		}

		if (currentDocBlobUrl) {
			URL.revokeObjectURL(currentDocBlobUrl);
		}
		currentDocBlobUrl = URL.createObjectURL(file);
		renderDocPreview(currentDocBlobUrl, file.type === "application/pdf");
		showDropzoneFile(file.name);
		ocrOptions = [];
		ocrMode = null;
		$("#ocr-multi-panel").hide();
		$("#iku-repeater-rows").hide().empty();
		$("#iku-single-block").show();

		if (file.size > 10 * 1024 * 1024) {
			setOcrStatus("danger", "Ukuran file melebihi 10 Mb, OCR dibatalkan. Silakan isi form manual.");
			return;
		}

		var fd = new FormData();
		fd.append("file", file);

		var jenisDokumen = $('input[name="jenis_dokumen"]:checked').val();
		var ocrEndpoint = (jenisDokumen === "aqms") ? "ocr/ikuAqmsExtract" : "ocr/ikuExtract";

		setOcrStatus("info", "Membaca dokumen, mohon tunggu...");
		$("#btn-simpan-iku").prop("disabled", true).text("Membaca dokumen...");

		$.ajax({
			url: baseUrl + ocrEndpoint,
			method: "POST",
			data: fd,
			processData: false,
			contentType: false,
			success: function(res) {
				try {
					res = (typeof res === "string") ? JSON.parse(res) : res;
				} catch (err) {
					res = { statusCode: 500, message: "Response OCR tidak valid" };
				}
				if (res.statusCode == 200) {
					if (res.data && res.data.multi) {
						ocrOptions = res.data.options || [];
						applySharedFields(ocrOptions[0] || {});
						$("#ocr_result_payload").val(JSON.stringify(res.data));

						var pickerHtml = '<option value="">--PILIH LOKASI--</option><option value="all">PILIH SEMUA</option>';
						jQuery.each(ocrOptions, function(i, opt) {
							pickerHtml += "<option value='" + i + "'>" + (opt.label || ("Lokasi " + (i + 1))) + "</option>";
						});
						$("#ocr-lokasi-picker").html(pickerHtml);
						$("#ocr-multi-panel").show();

						var matchedCount = 0;
						jQuery.each(ocrOptions, function(i, o) {
							if (o.lokasi && o.lokasi.uid) {
								matchedCount++;
							}
						});
						setOcrStatus("info", "Dokumen ini memuat " + ocrOptions.length + " lokasi pemantauan ("
							+ matchedCount + " cocok otomatis). Pilih salah satu lokasi, atau \"PILIH SEMUA\" "
							+ "untuk menampilkan semuanya sebagai form terpisah di bawah.");
					} else {
						$("#ocr-multi-panel").hide();
						ocrOptions = [];
						ocrMode = null;
						applySharedFields(res.data);
						var unmatched = applyOcrResult(res.data, { source: jenisDokumen });
						$("#ocr_result_payload").val(JSON.stringify(res.data));
						var msg = "Dokumen berhasil dibaca, form terisi otomatis. Mohon periksa kembali sebelum menyimpan.";
						if (unmatched.length) {
							setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
						} else {
							setOcrStatus("success", msg);
						}
					}
				} else {
					setOcrStatus("danger", (res.message || "OCR gagal dibaca") + ". Silakan isi form manual.");
				}
			},
			error: function() {
				setOcrStatus("danger", "OCR gagal dihubungi. Silakan isi form manual.");
			},
			complete: function() {
				$("#btn-simpan-iku").prop("disabled", false).text("Simpan");
			}
		});
	});

<script type="text/javascript">
	function searchData(tableSrc, txtSrc) {
		if (tableSrc, txtSrc) {
			var input, filter, table, tr, td, i, txtValue;
			input = document.getElementById(txtSrc);
			filter = input.value.toUpperCase();
			table = document.getElementById(tableSrc);
			tr = table.getElementsByTagName("tr");
			for (i = 0; i < tr.length; i++) {
				td = tr[i].getElementsByTagName("td")[1];
				td2 = tr[i].getElementsByTagName("td")[2];
				if (td && td2) {
					txtValue = td.textContent || td.innerText;
					txtValue2 = td2.textContent || td2.innerText;
					if ((txtValue.toUpperCase().indexOf(filter) > -1) || txtValue2.toUpperCase().indexOf(filter) > -1) {
						tr[i].style.display = "";
					} else {
						tr[i].style.display = "none";
					}
				}
			}

		}

	}
</script>
