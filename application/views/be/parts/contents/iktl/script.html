<script type="text/javascript">
	var scrollTobtn = '{/literal}{$scrollTobtn}{literal}';
	$(document).ready(function() {
		$('#primary').on('show.bs.modal', function(event) {
			$(".select-year-indeks").val("").trigger("change");
			$(".simulasi-content").html("");
		});

		$(document).on("click", "#btn-hitung-simulasi-kabkota", function(event) {
			var uid = $(this).attr("data-uid");
			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKL/hitung/x/" + uid + "/y/1",
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							if (res.data) {
								var iktl = (res.data.iktl > 100 ? 100 : res.data.iktl);
								$(".tl-" + uid + "-kabkota").html(Number(res.data.tl).toFixed(2));
								$(".iktl-" + uid + "-kabkota").html(Number(iktl).toFixed(2));
								$(".dkk-" + uid + "-kabkota").html(Number(res.data.dkk).toFixed(2));
								$(".tl-dkk-" + uid + "-kabkota").html(Number(res.data.tl_dkk).toFixed(2));
								$(".nilai-indeks-" + uid + "-kabkota").html(Number(res.data.nilai_indeks).toFixed(2));
							}
						}
					}
				});
			}
		});

		$(document).on("click", "#btn-hitung-simulasi-prov", function(event) {
			var uid = $(this).attr("data-uid");
			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKL/hitung/x/" + uid + "/y/2",
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							if (res.data) {
								var iktl = (res.data.iktl > 100 ? 100 : res.data.iktl);
								$(".tl-" + uid + "-prov").html(Number(res.data.tl).toFixed(2));
								$(".iktl-" + uid + "-prov").html(iktl.toFixed(2));
								$(".dkk-" + uid + "-prov").html(Number(res.data.dkk).toFixed(2));
								$(".tl-dkk-" + uid + "-prov").html(Number(res.data.tl_dkk).toFixed(2));
								$(".nilai-indeks-" + uid + "-prov").html(Number(res.data.nilai_indeks).toFixed(2));
							}
						}
					}
				});
			}
		});

		$(document).on("click", "#btn-hitung-simulasi-nasional", function(event) {
			var uid = $(this).attr("data-uid");
			if (uid) {
				$.ajax({
					url: baseUrl + "simulasiHitungIKL/hitungNasional/x/" + uid,
					method: "GET",
					success: function(request) {
						var res = JSON.parse(request);
						if (res.statusCode == 200) {
							if (res.data) {
								$(".ikl-" + uid + "-nasional").html(res.data.toFixed(2));
							}
						}
					}
				});
			}
		});

		$(".select-year-indeks").on("change", function() {
			var year = $(this).val();
			if (year != "") {
				$.ajax({
					url: baseUrl + "simulasiHitungIKL/getDataIndeks/x/" + year,
					method: "GET",
					success: function(req) {
						var res = JSON.parse(req);
						if (res.statusCode == 200) {
							var data = res;
							if (data) {
								$(".simulasi-content").html(data.html);
							}
						}
					}
				});
			}
		});
		setTimeout(function() {
			window.scrollTo(0, scrollTobtn);
		}, 1500);
	});

	var $repeaterDATATUTUPAN2 = $(".repeater-data_tutupan2").repeater({

	$('.tambah-rth').on('click', function() {
		$('#rincianRth').show();
		setTimeout(function() {
			var rthEdit = JSON.parse($('#data_rth').val());
			console.log(rthEdit);
			if (rthEdit) {
				$repeaterDATARTH.setList(rthEdit.data_rth);

	});

	$('.tambah-tutupan').on('click', function() {
		$('#rincianTutupan').show();

				$repeaterDATATUTUPAN.setList(tutupanEdit.data_tutupan);
			}

	});

	$("#simpan-rth").click(function() {
		$('#kebun_raya_data_lipi').val('');
		$('#taman_kehati').val('');
		$('#rth').val('');
		var luas1 = 0;
		var luas2 = 0;
		var luas3 = 0;
		if ($(".repeater-data_rth").find("tr[data-repeater-item]").length) {
			var simpan = $('.repeater-data_rth').repeaterVal();
			$('#data_rth').val(JSON.stringify(simpan));
			$(simpan.data_rth).each(function(k, v) {
				if (v.jenis_rth == 1) { // kebun raya
					luas1 += parseFloat(v.luas_rth);
					$('#kebun_raya_data_lipi').val(luas1);
				}
				if (v.jenis_rth == 2) { // taman kehati
					luas2 += parseFloat(v.luas_rth);
					$('#taman_kehati').val(luas2);
				}
				if (v.jenis_rth > 2) { // rth
					luas3 += parseFloat(v.luas_rth);
					$('#rth').val(luas3);
				}
			});
		} else {
			$('#data_rth').val('');
			$('#kebun_raya_data_lipi').val(luas1);
			$('#taman_kehati').val(luas2);
			$('#rth').val(luas3);
		}
	});

	$("#simpan-tutupan").click(function() {
		$('#tutupan_vegetasi').val('');
		var luas = 0;
		if ($(".repeater-data_tutupan").find("tr[data-repeater-item]").length) {
			var simpan = $('.repeater-data_tutupan').repeaterVal();
			$('#data_tutupan').val(JSON.stringify(simpan));
			$(simpan.data_tutupan).each(function(k, v) {
				luas += parseFloat(v.luas_tutupan);
				$('#tutupan_vegetasi').val(luas);
			});
		} else {
			$('#data_tutupan').val('');
			$('#tutupan_vegetasi').val(luas);
		}
	});

	$('#detailRth').on('show.bs.modal', function(event) {
		var button = $(event.relatedTarget) // Button that triggered the modal
		var userBy = button.data('uid');
		$("#id-pelaporan").val(userBy);

		if (userBy) {
			$.ajax({
				url: baseUrl + ctrl + "/detailDataRth/x/" + userBy,
				method: "GET",
				success: function(req) {
					console.log(req);
					var data_rth = req.data_rth;
					var data_rth2 = req.data_rth;
					if (req) {
						for (var key in data_rth2) {
							if (data_rth2.hasOwnProperty(key)) {
								if (data_rth2[key].verify == '' || data_rth2[key].verify == null) {
									data_rth2[key].verify = 1;
								}
							}
						}
						$repeaterDATARTH2.setList(data_rth2);
					}
					for (var key in data_rth) {
						if (data_rth.hasOwnProperty(key)) {
							if (data_rth[key].jenis_rth == 1) {
								data_rth[key].jenis_rth = "Kebun Raya";
							} else if (data_rth[key].jenis_rth == 2) {
								data_rth[key].jenis_rth = "Taman Kehati";
							} else if (data_rth[key].jenis_rth == 3) {
								data_rth[key].jenis_rth = "Hutan Kota";
							} else if (data_rth[key].jenis_rth == 4) {
								data_rth[key].jenis_rth = "Taman Kota";
							} else if (data_rth[key].jenis_rth == 5) {
								data_rth[key].jenis_rth = "Taman Hutan Raya";
							} else if (data_rth[key].jenis_rth == 6) {
								data_rth[key].jenis_rth = "Media Jalan";
							} else if (data_rth[key].jenis_rth == 7) {
								data_rth[key].jenis_rth = "Sabuk Hijau";
							} else if (data_rth[key].jenis_rth == 8) {
								data_rth[key].jenis_rth = "Jalur di Bawah Tegangan Tinggi Listrik";
							} else if (data_rth[key].jenis_rth == 9) {
								data_rth[key].jenis_rth = "Sempadan Sungai";
							} else if (data_rth[key].jenis_rth == 10) {
								data_rth[key].jenis_rth = "Daerah Penyangga";
							} else if (data_rth[key].jenis_rth == 11) {
								data_rth[key].jenis_rth = "Kebun Binatang";
							} else if (data_rth[key].jenis_rth == 12) {
								data_rth[key].jenis_rth = "Arboretrum";
							} else if (data_rth[key].jenis_rth == 13) {
								data_rth[key].jenis_rth = "Taman Rekreasi";
							}

							if (data_rth[key].sumber_dana == 1) {
								data_rth[key].sumber_dana = "APBN";
							} else if (data_rth[key].sumber_dana == 2) {
								data_rth[key].sumber_dana = "APBD";
							} else if (data_rth[key].sumber_dana == 3) {
								data_rth[key].sumber_dana = "SWASTA";
							}

							if (data_rth[key].verify == 1) {
								data_rth[key].verify = "Verified";
							} else if (data_rth[key].verify == 2 || data_rth[key].verify == null || data_rth[key].verify == '') {
								data_rth[key].verify = "Unverified";
							}
						}
					}
					var $btnDLtoExcel = $('#export-data-excel-rth');
					$btnDLtoExcel.on('click', function() {
						$("#dvjson").excelexportjs({
							containerid: "dvjson",
							datatype: 'json',
							dataset: data_rth,
							columns: getColumns(data_rth)
						});
					});
				}
			})
		}
	});

	$(".simpan-rth-verifikator").on("click hide.bs.modal", function(event) {
		var luas1 = 0;
		var luas2 = 0;
		var luas3 = 0;
		if ($(".repeater-data_rth2").find("tr[data-repeater-item]").length) {
			var simpan = $('.repeater-data_rth2').repeaterVal();
			var data_rth = JSON.stringify(simpan);
			$(simpan.data_rth).each(function(k, v) {
				if (v.jenis_rth == 1 && v.verify == 1) { // kebun raya
					luas1 += parseFloat(v.luas_rth);
				}
				if (v.jenis_rth == 2 && v.verify == 1) { // taman kehati
					luas2 += parseFloat(v.luas_rth);
				}
				if (v.jenis_rth > 2 && v.verify == 1) { // rth
					luas3 += parseFloat(v.luas_rth);
				}
			});
		}
		var idPelaporan = $("#id-pelaporan").val();
		if (idPelaporan) {
			$.ajax({
				url: baseUrl + ctrl + "/rthVerifikasi",
				method: "POST",
				data: JSON.stringify({
					uid: idPelaporan,
					data_rth: data_rth,
					kebun_raya_data_lipi: luas1,
					taman_kehati: luas2,
					rth: luas3
				}),
				success: function(request) {
					if (request == 1) {
						$("#verifikasi-kebun-" + idPelaporan).html(luas1);
						$("#verifikasi-taman-" + idPelaporan).html(luas2);
						$("#verifikasi-rth-" + idPelaporan).html(luas3);
					}
				}
			});
		}
	});

	$('#tambahData').on('show.bs.modal', function(event) {
		reset();
		var button = $(event.relatedTarget) // Button that triggered the modal
		var userBy = button.data('uid');

		if (userBy) {
			$.ajax({
				url: baseUrl + ctrl + "/editData/x/" + userBy,
				method: "GET",
				success: function(req) {
					// console.log(req);
					if (req.uid_pelaporan_iktl) {
						$("#uid_pelaporan_iktl").val(req.uid_pelaporan_iktl);
						$("#tanggal").val(req.tanggal);
						$('input[name="form[tanggal]_submit"]').attr('value', req.tanggal);
						$("#luas_wilayah").val(req.luas_wilayah);
						$("#luas_hutan").val(req.luas_hutan);
						$("#luas_belukar_dalam_kawasan").val(req.luas_belukar_dalam_kawasan);
						$("#luas_belukar_pada_fungsi_lindung").val(req.luas_belukar_pada_fungsi_lindung);
						$("#kebun_raya_data_lipi").val(req.kebun_raya_data_lipi);
						$("#rth").val(req.rth);
						$("#taman_kehati").val(req.taman_kehati);
						$("#tutupan_vegetasi").val(req.tutupan_vegetasi);
						$("#rhl").val(req.rhl);
						$("#dkk").val(req.dkk);

						$("#hutan_lahan_kering_primer").val(req.hutan_lahan_kering_primer);
						$("#hutan_lahan_kering_sekunder").val(req.hutan_lahan_kering_sekunder);
						$("#hutan_mangrove_primer").val(req.hutan_mangrove_primer);
						$("#hutan_rawa_primer").val(req.hutan_rawa_primer);
						$("#hutan_tanaman").val(req.hutan_tanaman);
						$("#belukar").val(req.belukar);

	var maxLenghtText = 700;
	$(".catatan-verifikator").on('click', function() {
		$("#id-pelaporan").val("");

		$("#catatan-verifikator-select").val("").trigger("change");

		var idPelaporan = $(this).attr("data-uid");
		$("#id-pelaporan").val(idPelaporan);
		if (idPelaporan) {
			$.ajax({
				url: baseUrl + ctrl + "/getCatatanVerifikasi/x/" + idPelaporan,
				method: "GET",
				success: function(request) {
					var req = JSON.parse(request);
					if (req.statusCode == 200) {
						$("#catatan-verifikator-txt").val(req.catatan).trigger("keyup");
						$("#catatan-verifikator-select").val(req.catatanSelect).trigger("change");
					}
				}
			});
		}
	});

	$("#catatan-verifikator-txt").on("keyup", function(){
		var val = $(this).val();
		var length_text = val.length;
		if(length_text > maxLenghtText){
			$("#catatan-verifikator-txt").val(val.substring(0,maxLenghtText));
			length_text = maxLenghtText;
		}
		$("#catatan-verifikator-txt-length").html("*Sudah terisi "+length_text+"/"+maxLenghtText+" Karakter")
	});

<script type="text/javascript">
	function searchData(tableSrc, txtSrc) {
		if (tableSrc, txtSrc) {
			var input, filter, table, tr, td, i, txtValue;
			input = document.getElementById(txtSrc);
			filter = input.value.toUpperCase();
			table = document.getElementById(tableSrc);
			tr = table.getElementsByTagName("tr");
			for (i = 0; i < tr.length; i++) {
				td = tr[i].getElementsByTagName("td")[1];
				td2 = tr[i].getElementsByTagName("td")[2];
				if (td && td2) {
					txtValue = td.textContent || td.innerText;
					txtValue2 = td2.textContent || td2.innerText;
					if ((txtValue.toUpperCase().indexOf(filter) > -1) || txtValue2.toUpperCase().indexOf(filter) > -1) {
						tr[i].style.display = "";
					} else {
						tr[i].style.display = "none";
					}
				}
			}

		}

	}
</script>
