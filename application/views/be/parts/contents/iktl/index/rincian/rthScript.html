<script type="text/javascript">

  $(document).ready(function(){
    var viewOnly = $("#viewOnly").val();
    if(!viewOnly){
      $("#form-rth-submit").attr("style","display:none;");
      var dataRth = $('#data_rth').val();
      var dataRthJsonFile = $('#data_rth_json_file').val();
      // console.log(dataRthJsonFile);
      if(dataRth){
        $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
        sendFile(dataRth,2,"");
        // var formSubmit = new FormData();
        // // formSubmit.append('rth_data_json', btoa(dataRth));
        // // formSubmit.append('rth_data_json', dataRth);
        // formSubmit.append('file_json', nameFile);
        // formSubmit.append('jenis_upload_rth', 2);
        // getdataRthDetail(formSubmit);
      }else if (dataRthJsonFile) {
        $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
        var formSubmit = new FormData();
        formSubmit.append('file_json', dataRthJsonFile);
        formSubmit.append('jenis_upload_rth', 2);
        getdataRthDetail(formSubmit);
      }
    }
  });

  function sendFile(jsonData, jenis_upload_rth, fileExcel = ""){
    var blob = new Blob([jsonData], {type: "application/json"});
    var formSubmitTest = new FormData();
    formSubmitTest.append('fileJson', blob);
    $.ajax({
      url: baseUrl + 'iktl/uploadJsonFile',
      type: 'POST',
      data: formSubmitTest,
      contentType: false,
      processData: false,
      async: true,
      success: function(response) {
        var formSubmit = new FormData();
        if(fileExcel){
          formSubmit.append('file_json', response);
          formSubmit.append('file', fileExcel);
          formSubmit.append('jenis_upload_rth', jenis_upload_rth);
          uploadExcelFile(formSubmit);
        }else{
          formSubmit.append('file_json', response);
          formSubmit.append('jenis_upload_rth', 2);
          getdataRthDetail(formSubmit);
        }
      }
    });
  }

  function getdataRthDetail(formSubmit){
    $.ajax({
      url: baseUrl + 'iktl/rthUpload',
      type: 'POST',
      data: formSubmit,
      contentType: false,
      processData: false,
      async: true,
      success: function(response) {
        $(".push-list").html("");
        var res = (JSON.parse(response));
        if(res.statusCode == 200){
          $(".push-list").html(res.html);
          $("#form-rth-submit").show();
        }else{
          swal("Error","Data tidak dapat terbaca oleh sistem!","error");
        }
      }
    });
  }

  function uploadExcelFile(formSubmit){
    $.ajax({
      url: baseUrl + 'iktl/rthUpload',
      type: 'POST',
      data: formSubmit,
      contentType: false,
      processData: false,
      success: function(response) {
        var res = (JSON.parse(response));
        if(res.statusCode == 200){
          toastr.success('Data berhasil ditambah', 'Success');
          $("#form-rth-submit").show();
          $(".push-list").html(res.html);
        }else{
          swal("Error","Data tidak dapat terbaca oleh sistem!","error");
        }
        $("#file-rth").val("").trigger("change");
      }
    });
  }

  $(".page-rth-detail").on("click", function(){
    var id = $(this).attr("data-uid");
    var ps = $(this).attr("page-start");
    var pe = $(this).attr("page-end");
    var dv = $(this).attr("data-verifikasi");
    $.ajax({
			url: baseUrl + ctrl + "/rthDetail/x/"+id+"/ps/"+ps+"/pe/"+pe+"/dv/"+dv,
			method: "GET",
			success: function(request) {
				var req = JSON.parse(request);
				if (req.statusCode == 200) {
					$(".push-content").html(req.html);
				}
			}
		});
  })

  $("#rth_metode_penginputan").on("change", function(){
    // $(".push-list").html("");
    $(".rthMetodeUpload").hide();
    $(".rthMetodeCopy").hide();
    var val = $(this).val();
    if(val == 1){
      $(".rthMetodeUpload").show();
    }else if (val == 2) {
      var optionHtml = "<option value=''>--Pilih--</option>";
      $("#copy_tanggal_pelaporan").html(optionHtml);
      var uid_provinsi = $("#uid_provinsi").val();
      var uid_kabkota = $("#uid_kabkota").val();
      if(uid_provinsi > 0 && uid_kabkota > 0){
        $.ajax({
          url: baseUrl + 'iktl/rthLocation/p/'+uid_provinsi+"/k/"+uid_kabkota,
          type: 'GET',
          success: function(response) {
            var res = (JSON.parse(response));
            res.data.forEach((item, i) => {
              optionHtml += "<option value='"+item.data_rth+"'>"+item.tanggal+"</option>";
            });
            $("#copy_tanggal_pelaporan").html(optionHtml);
          }
        });
      }
      $(".rthMetodeCopy").show();
    }
  });

  $("#copy_tanggal_pelaporan").on("change", function(){
    var data = $(this).val();
    $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
    if(data){
      sendFile(data,2,"");
    }else{
        $(".push-list").html("<div class='alert alert-warning'>TIDAK ADA ADATA</div>");
    }
  });

  $("#jenis_upload_rth").on("change", function(){
    uploadFile();
  });
  $('#file-rth').change(function() {
    uploadFile();
  });
  function uploadFile(){
    var id = "form-rth";
    var formDataGet = document.forms[id];
    var formData = new FormData(formDataGet);

    // var formJson = formData.getAll('form');
    var form_jenis_rth = formData.getAll('jenis_rth');

    var form_nama_desa = formData.getAll('nama_desa');
    var form_nama_kecamatan = formData.getAll('nama_kecamatan');
    var form_koordinat_lintang = formData.getAll('koordinat_lintang');
    var form_koordinat_bujur = formData.getAll('koordinat_bujur');

    var form_keterangan = formData.getAll('keterangan');

    var tmpJsonRth = [];
    form_jenis_rth.forEach((item, i) => {
      tmpJsonRth.push({

        luas_rth : form_luas_rth[i],
        nama_rth : form_nama_rth[i],
        nama_desa : form_nama_desa[i],
        nama_kecamatan : form_nama_kecamatan[i],
        koordinat_lintang : form_koordinat_lintang[i],
        koordinat_bujur : form_koordinat_bujur[i],
        sumber_dana : form_sumber_dana[i],
        nomor_sk : form_nomor_sk[i],
        keterangan : form_keterangan[i],
        verify : form_verify[i]
      });
    });

    var formSubmit = new FormData();

    var jenisUpload = $("#jenis_upload_rth").val();
    var files = $('#file-rth')[0].files[0];
    if(files && jenisUpload){

      var textAlert = (jenisUpload == 1 ? 'Data baru , Data yang sudah diupload akan diganti dengan data baru' : 'Tambah data, menambahkan data ke data yang sudah ada');
      swal({
				title: 'Konfirmasi Data',
				text: textAlert,
				type: 'warning',
				showCancelButton: true,
				confirmButtonColor: '#3085d6',
				cancelButtonColor: '#d33',
				confirmButtonText: 'Ya, sudah sesuai!',
				cancelButtonText: 'Batal'
			}).then(function(result) {
				if (result.value) {
          var tmpDataRthSubmit = {
            "data_rth":tmpJsonRth
          }
          sendFile(JSON.stringify(tmpDataRthSubmit), jenisUpload,files);
          // formSubmit.append('rth_data_json', JSON.stringify(tmpDataRthSubmit));
          // formSubmit.append('file', files);
          // formSubmit.append('jenis_upload_rth', jenisUpload);
          // $.ajax({
          //   url: baseUrl + 'iktl/rthUpload',
          //   type: 'POST',
          //   data: formSubmit,
          //   contentType: false,
          //   processData: false,
          //   success: function(response) {
          //     var res = (JSON.parse(response));
          //     if(res.statusCode == 200){
          //       $(".push-list").html(res.html);
          //     }else{
          //       swal("Error","Data tidak dapat terbaca oleh sistem!","error");
          //     }
          //     $("#file-rth").val("").trigger("change");
          //   }
          // });
        }else{
          $("#jenis_upload_rth").val("").trigger("change");
        }
      });
    }
  }
  $("#form-rth-submit").on("click", function(){
    var id = "form-rth";
    var formDataGet = document.forms[id];
    var formData = new FormData(formDataGet);

    var form_jenis_rth = formData.getAll('jenis_rth');
    var form_luas_rth = formData.getAll('luas_rth');
    var form_nama_rth = formData.getAll('nama_rth');
    var form_nama_desa = formData.getAll('nama_desa');
    var form_nama_kecamatan = formData.getAll('nama_kecamatan');
    var form_koordinat_lintang = formData.getAll('koordinat_lintang');
    var form_koordinat_bujur = formData.getAll('koordinat_bujur');
    var form_sumber_dana = formData.getAll('sumber_dana');
    var form_nomor_sk = formData.getAll('nomor_sk');
    var form_keterangan = formData.getAll('keterangan');
    var form_verify = formData.getAll('verify');

    var tmpJsonRth = [];
    var kebun_raya_data_lipi_sum = 0
    var taman_kehati_sum = 0
    var rth_sum = 0
    form_jenis_rth.forEach((item, i) => {
      tmpJsonRth.push({
        jenis_rth : form_jenis_rth[i],
        luas_rth : form_luas_rth[i],

        nama_kecamatan : form_nama_kecamatan[i],
        koordinat_lintang : form_koordinat_lintang[i],
        koordinat_bujur : form_koordinat_bujur[i],
        sumber_dana : form_sumber_dana[i],
        nomor_sk : form_nomor_sk[i],
        keterangan : form_keterangan[i],
        verify : (form_verify[i] ? form_verify[i] : 1),
      });

      if(form_verify[i] == 1){
        if(form_jenis_rth[i] == 1){
          kebun_raya_data_lipi_sum += (form_luas_rth[i] ? parseFloat(form_luas_rth[i]) : 0);
        }else if (form_jenis_rth[i] == 2) {
          taman_kehati_sum += (form_luas_rth[i] ? parseFloat(form_luas_rth[i]) : 0);
        }else if (form_jenis_rth[i] > 2) {
          rth_sum += (form_luas_rth[i] ? parseFloat(form_luas_rth[i]) : 0);
        }
      }
    });

    $('#kebun_raya_data_lipi').val(kebun_raya_data_lipi_sum);
    $('#taman_kehati').val(taman_kehati_sum);
    $('#rth').val(rth_sum);

      "data_rth":tmpJsonRth
    }

    $('#data_rth').val('');

      $('#data_rth').val('');
      var dataRthJsonFile = $("#data_rth_json_file").val();
      if(dataRth){
	      var blob = new Blob([dataRth], {type: "application/json"});
	      var formSubmitTest = new FormData();
        formSubmitTest.append('fileJson', blob);
	      formSubmitTest.append('data_rth_json_file', dataRthJsonFile);
	      $.ajax({
	        url: baseUrl + 'iktl/uploadJsonFile',
	        type: 'POST',
	        data: formSubmitTest,
	        contentType: false,
	        processData: false,
	        async: true,
	        success: function(response) {
            console.log(response);
            if(response){
              $("#data_rth_json_file").val(response);
              var hrefData = "<br><a target='_blank' href='"+baseUrl+"uploads/rth_detail_json/"+response+"' class='badge badge-warning badge-xs'>Lihat Data RTH</a>";
							$("#preview-data-rth").html(hrefData);
              toastr.warning('Data RTH disimpan dipenyimpanan sementara, silahkan klik tombol simpan di form isian utama (Tambah Data Ikl) untuk menyimpan data terbaru', 'Info');
            }else{
              toastr.error('Data gagal disimpan', 'Error');
            }
	        }
	      });
	    }
    // }

  })
</script>
