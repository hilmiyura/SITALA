<script type="text/javascript">

  $(document).ready(function(){
    var viewOnly = $("#viewOnly").val();
    if(!viewOnly){
      $("#form-tutupan-submit").attr("style","display:none;");
      var dataTutupan = $('#data_tutupan').val();
      var dataTutupanJsonFile = $('#data_tutupan_json_file').val();
      // console.log(dataTutupanJsonFile);
      if(dataTutupan){
        $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
        sendFile(dataTutupan,2,"");
        // var formSubmit = new FormData();
        // // formSubmit.append('tutupan_data_json', btoa(dataTutupan));
        // // formSubmit.append('tutupan_data_json', dataTutupan);
        // formSubmit.append('file_json', nameFile);
        // formSubmit.append('jenis_upload_tutupan', 2);
        // getdataTutupanDetail(formSubmit);
      }else if (dataTutupanJsonFile) {
        $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
        var formSubmit = new FormData();
        formSubmit.append('file_json', dataTutupanJsonFile);
        formSubmit.append('jenis_upload_tutupan', 2);
        getdataTutupanDetail(formSubmit);
      }
    }
  });

  function sendFile(jsonData, jenis_upload_tutupan, fileExcel = ""){
    var blob = new Blob([jsonData], {type: "application/json"});
    var formSubmitTest = new FormData();
    formSubmitTest.append('fileJson', blob);
    $.ajax({
      url: baseUrl + 'iktl/uploadJsonFileTutupan',
      type: 'POST',
      data: formSubmitTest,
      contentType: false,
      processData: false,
      async: true,
      success: function(response) {
        var formSubmit = new FormData();
        if(fileExcel){
          formSubmit.append('file_json', response);
          formSubmit.append('file', fileExcel);
          formSubmit.append('jenis_upload_tutupan', jenis_upload_tutupan);
          uploadExcelFile(formSubmit);
        }else{
          formSubmit.append('file_json', response);
          formSubmit.append('jenis_upload_tutupan', 2);
          getdataTutupanDetail(formSubmit);
        }
      }
    });
  }

  function getdataTutupanDetail(formSubmit){
    $.ajax({
      url: baseUrl + 'iktl/tutupanUpload',
      type: 'POST',
      data: formSubmit,
      contentType: false,
      processData: false,
      async: true,
      success: function(response) {
        $(".push-list").html("");
        var res = (JSON.parse(response));
        if(res.statusCode == 200){
          $(".push-list").html(res.html);
          $("#form-tutupan-submit").show();
        }else{
          swal("Error","Data tidak dapat terbaca oleh sistem!","error");
        }
      }
    });
  }

  function uploadExcelFile(formSubmit){
    $.ajax({
      url: baseUrl + 'iktl/tutupanUpload',
      type: 'POST',
      data: formSubmit,
      contentType: false,
      processData: false,
      success: function(response) {
        var res = (JSON.parse(response));
        if(res.statusCode == 200){
          toastr.success('Data berhasil ditambah', 'Success');
          $("#form-tutupan-submit").show();
          $(".push-list").html(res.html);
        }else{
          swal("Error","Data tidak dapat terbaca oleh sistem!","error");
        }
        $("#file-tutupan").val("").trigger("change");
      }
    });
  }

  $(".page-tutupan-detail").on("click", function(){
    var id = $(this).attr("data-uid");
    var ps = $(this).attr("page-start");
    var pe = $(this).attr("page-end");
    var dv = $(this).attr("data-verifikasi");
    $.ajax({
			url: baseUrl + ctrl + "/tutupanDetail/x/"+id+"/ps/"+ps+"/pe/"+pe+"/dv/"+dv,
			method: "GET",
			success: function(request) {
				var req = JSON.parse(request);
				if (req.statusCode == 200) {
					$(".push-content").html(req.html);
				}
			}
		});
  })

  $("#tutupan_metode_penginputan").on("change", function(){
    // $(".push-list").html("");
    $(".tutupanMetodeUpload").hide();
    $(".tutupanMetodeCopy").hide();
    var val = $(this).val();
    if(val == 1){
      $(".tutupanMetodeUpload").show();
    }else if (val == 2) {
      var optionHtml = "<option value=''>--Pilih--</option>";
      $("#copy_tanggal_pelaporan").html(optionHtml);
      var uid_provinsi = $("#uid_provinsi").val();
      var uid_kabkota = $("#uid_kabkota").val();
      if(uid_provinsi > 0 && uid_kabkota > 0){
        $.ajax({
          url: baseUrl + 'iktl/tutupanLocation/p/'+uid_provinsi+"/k/"+uid_kabkota,
          type: 'GET',
          success: function(response) {
            var res = (JSON.parse(response));
            res.data.forEach((item, i) => {
              optionHtml += "<option value='"+item.data_tutupan+"'>"+item.tanggal+"</option>";
            });
            $("#copy_tanggal_pelaporan").html(optionHtml);
          }
        });
      }
      $(".tutupanMetodeCopy").show();
    }
  });

  $("#copy_tanggal_pelaporan").on("change", function(){
    var data = $(this).val();
    $(".push-list").html("<div class='alert alert-danger'>Sedang menyiapkan data...</div>");
    if(data){
      sendFile(data,2,"");
    }else{
        $(".push-list").html("<div class='alert alert-warning'>TIDAK ADA ADATA</div>");
    }
  });

  $("#jenis_upload_tutupan").on("change", function(){
    uploadFile();
  });
  $('#file-tutupan').change(function() {
    uploadFile();
  });
  function uploadFile(){

				if (result.value) {

            "data_tutupan":tmpJsonTutupan

          // formSubmit.append('file', files);
          // formSubmit.append('jenis_upload_tutupan', jenisUpload);
          // $.ajax({
          //   url: baseUrl + 'iktl/tutupanUpload',
          //   type: 'POST',
          //   data: formSubmit,
          //   contentType: false,
          //   processData: false,
          //   success: function(response) {
          //     var res = (JSON.parse(response));
          //     if(res.statusCode == 200){
          //       $(".push-list").html(res.html);
          //     }else{
          //       swal("Error","Data tidak dapat terbaca oleh sistem!","error");
          //     }
          //     $("#file-tutupan").val("").trigger("change");
          //   }
          // });
        }else{
          $("#jenis_upload_tutupan").val("").trigger("change");
        }
      });
    }
  }
