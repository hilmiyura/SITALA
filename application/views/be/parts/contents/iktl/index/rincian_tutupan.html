<div class="modal text-left" id="detailTutupan" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info bg-darken-2 white">
        <h4 class="modal-title white" id="myModalLabel8">
          <i class="ft-download-cluod"></i> Rincian Tutupan Vegetasi Relevan Lainnya
        </h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="repeater-data_tutupan2" style="overflow-x: auto;">
            <div class="table-responsive table-border freeze-table">
              <table class="table">
                <thead class="bg-info bg-darken-2 white">
                  <tr>
                    <th>Jenis Tutupan</th>
                    <th>Luas</th>
                    <th>Nama Tutupan</th>
                    <th>Nama Desa</th>
                    <th>Nama Kecamtan</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Sumber Dana</th>
                    <th>Nomor SK</th>
                    <th>Keterangan</th>
                  </tr>
                </thead>
                <tbody data-repeater-list="data_tutupan">
                  <tr data-repeater-item>
                    <td class="p-0">
                      <select class="custom-select form-control border-0 m-0 position-relative jenis_tutupan" name="jenis_tutupan" readonly style="width: 100%" required="">
                        <option value="">-- PILIH JENIS Tutupan Vegetasi Relevan Lainnya --</option>
                        <option value="1">Hutan Adat</option>
                        <option value="2">Hutan Rakyat</option>
                        <option value="3">Pepohonan lainnya yang relevan</option>
                        <option value="4">Taman Lingkungan (Taman RT / RW / Kelurahan / Kecamatan)</option>
                        <option value="5">Pekarangan (Perumahan / Perkantoran / Pertokoan)</option>
                      </select>
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 luas_tutupan" readonly placeholder="Luas" name="luas_tutupan" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 nama_tutupan" readonly placeholder="Nama Tutupan" name="nama_tutupan" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 nama_desa" readonly placeholder="Nama Desa" name="nama_desa" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 nama_kecamatan" readonly placeholder="Nama Kecamatan" name="nama_kecamatan" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 koordinat_lintang" readonly placeholder="Koordinat Lintang" name="koordinat_lintang" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 koordinat_bujur" readonly placeholder="Koordinat Bujur" name="koordinat_bujur" />
                    </td>
                    <td class="p-0">
                      <select class="custom-select form-control border-0 m-0 position-relative sumber_dana" readonly name="sumber_dana" style="width: 100%" required="">
                        <option value="">-- PILIH SUMBER DANA --</option>
                        <option value="1">APBN</option>
                        <option value="2">APBD</option>
                        <option value="3">SWASTA</option>
                      </select>
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 nomor_sk" readonly placeholder="Nomor SK" name="nomor_sk" />
                    </td>
                    <td class="p-0">
                      <input type="text" class="form-control border-0 m-0 keterangan" readonly placeholder="Keterangan" name="keterangan" />
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a type="button" class="btn grey btn-secondary white" data-dismiss="modal">Close</a>
        </div>
      </div>
    </div>
  </div>
</div>
