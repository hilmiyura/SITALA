<!-- Modal -->
<div class="modal text-left" id="tambahData" role="dialog" aria-labelledby="myModalLabel6" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info bg-darken-2 white">
        <h4 class="modal-title white" id="myModalLabel6">
          <i class="ft-plus-circle"></i> Tambah Nilai DKK Provinsi
        </h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form class="form_with_load" method="POST" action="" enctype="multipart/form-data">
        <input type="hidden" name="form[{$primaryKey}]" id="{$primaryKey}" />
        <div class="modal-body">
          <div class="form-row">
            <div class="col-md-4 mb-3">
              <label for="name">Nilai DKK</label>
              <input type="text" class="form-control position-relative numberFormat" name="form[nilai]" id="nilai" placeholder="nilai dkk" value="" required="" />
            </div>

            <div class="col-md-5 mb-3">
              <label for="name">Provinsi</label>
              <select class="select2 form-control position-relative provinsi_select" id="uid_provinsi" name="form[uid_provinsi]" style="width: 100%">
                <option value="">--PILIH PROVINSI--</option>
                {foreach from=$provinsi item=v}
                <option value="{$v.kd_propinsi}">{$v.nama_propinsi}</option>
                {/foreach}
              </select>
            </div>

            <div class="col-md-3 mb-3">
              <label for="name">Tahun</label>
              <select class="form-control select2 position-relative" id="tahun" name="form[tahun]" required="required">
                  <option value=""> --PILIH TAHUN-- </option>
                  {for $foo=2015 to ($thisYear+5)}
                    <option value="{$foo}"> {$foo} </option>
                  {/for}
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a type="button" class="btn grey btn-secondary white" data-dismiss="modal">Close</a>
          <button type="submit" name="submit" class="btn btn-danger">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
