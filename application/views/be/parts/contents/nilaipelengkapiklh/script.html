{literal}
	<script type="text/javascript">
		reset = ()=>{
			$("#uid_nilai_pelengkap_iklh").val("");
			$("#iku_pm25_satelit").val("");
			$("#tahun").val("").trigger("change");
      $("#peruntukan").val("").trigger("change");
			$("#uid_provinsi").val("").trigger("change");
			id_kabkota = 0;
			$("#uid_kabkota").val("").trigger("change");
		}

		$('#tambahData').on('show.bs.modal', function (event) {
			reset();
			var button = $(event.relatedTarget) // Button that triggered the modal
			var userBy = button.data('uid');
			if(userBy){
				$.ajax({
					url		: baseUrl+ctrl+"/editData/x/"+userBy,
					method	: "GET",
					success	: function(req){
						if(req.uid_nilai_pelengkap_iklh){
							$("#uid_nilai_pelengkap_iklh").val(req.uid_nilai_pelengkap_iklh);
							$("#iku_pm25_satelit").val(req.iku_pm25_satelit);
							$("#tahun").val(req.tahun).trigger("change");
              $("#peruntukan").val(req.peruntukan).trigger("change");
							$("#uid_provinsi").val(req.uid_provinsi).trigger("change");
							id_kabkota = req.uid_kabkota;
							$("#uid_kabkota").val(req.uid_kabkota).trigger("change");
						}
					}
				})
			}
		});
		$("#peruntukan").on("change", function(){
			var val = $(this).val();
			if(val == 1){
				$("#uid_kabkota").attr("required",true);
			}else{
				$("#uid_kabkota").attr("required",false);
			}
		});
	</script>
{/literal}
