<script type="text/javascript">
  var scrollTobtn = '{/literal}{$scrollTobtn}{literal}';
  var currentDocBlobUrl = null;
  var ocrOptions = [];
  var ocrMode = null; //null|"single"|"all"

  //FE criteria checks on OCR results — koordinat SHU vs lokasi terdaftar (logika & tampilan sama seperti IKU), dan batas nilai DO
  var KOORDINAT_TOLERANSI_OK_M = 50;
  var KOORDINAT_TOLERANSI_WARN_M = 100;
  var DO_MAX_VALUE = 8.5;

  function haversineMeters(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var toRad = function(d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function setBoxStatus($box, type, html) {
    $box.removeClass("alert-info alert-success alert-warning alert-danger")
      .addClass("alert-" + type)
      .html(html)
      .show();
  }

  //sfx = "" for the single block, "_r0", "_r1", ... for repeater rows
  function renderKoordinatCheck(sfx, ocrLat, ocrLng, regLat, regLng) {
    var $box = $("#cek-koordinat" + sfx);
    ocrLat = parseFloat(ocrLat);
    ocrLng = parseFloat(ocrLng);
    regLat = parseFloat(regLat);
    regLng = parseFloat(regLng);

    if (isNaN(ocrLat) || isNaN(ocrLng) || isNaN(regLat) || isNaN(regLng)) {
      $box.hide().html("");
      return;
    }

    var jarakLangsung = Math.round(haversineMeters(ocrLat, ocrLng, regLat, regLng));
    //sejumlah lokasi terdaftar diketahui punya kolom latitude/longitude tertukar (data entry lama) —
    //cek juga jarak seandainya keduanya ditukar, supaya tidak menampilkan selisih raksasa yang
    //menyesatkan padahal sebenarnya cuma tertukar (sama seperti IKU)
    var jarakTertukar = Math.round(haversineMeters(ocrLat, ocrLng, regLng, regLat));
    var koordDasar = "Koordinat SHU: " + ocrLat + ", " + ocrLng + " &middot; Terdaftar: " + regLat + ", " + regLng;

    if (jarakTertukar <= KOORDINAT_TOLERANSI_WARN_M && jarakTertukar < jarakLangsung * 0.5) {
      setBoxStatus($box, "warning", "<b>Latitude/Longitude lokasi terdaftar kemungkinan tertukar</b> &middot; " + koordDasar
        + " &middot; Selisih langsung ~" + jarakLangsung + " m, setelah ditukar ~" + jarakTertukar + " m"
        + " &middot; Mohon periksa &amp; perbaiki data Lokasi Pemantauan.");
      return;
    }

    var jarak = Math.min(jarakLangsung, jarakTertukar);
    var type = "danger";
    var label = "Koordinat SHU tidak sesuai lokasi terdaftar";
    if (jarak <= KOORDINAT_TOLERANSI_OK_M) {
      type = "success";
      label = "Koordinat SHU sesuai lokasi terdaftar";
    } else if (jarak <= KOORDINAT_TOLERANSI_WARN_M) {
      type = "warning";
      label = "Koordinat SHU perlu diperiksa";
    }
    var catatanTertukar = (jarakTertukar < jarakLangsung)
      ? " &middot; (jarak setelah ditukar lebih dekat: ~" + jarakTertukar + " m, kemungkinan lat/long lokasi terdaftar tertukar)"
      : "";

    setBoxStatus($box, type, "<b>" + label + "</b> &middot; " + koordDasar + " &middot; Selisih ~" + jarak + " m" + catatanTertukar);
  }

  function updateDoBadge(sfx) {
    var $badge = $("#cek-do" + sfx);
    var raw = $("#do_p" + sfx).val();
    var num = parseFloat(String(raw).replace(",", "."));
    if (raw === "" || raw === undefined || isNaN(num)) {
      $badge.hide();
      return;
    }
    if (num <= DO_MAX_VALUE) {
      $badge.removeClass("badge-kriteria-warn").addClass("badge-kriteria-ok")
        .text("✓ DO sesuai (" + num + " mg/L)").show();
    } else {
      $badge.removeClass("badge-kriteria-ok").addClass("badge-kriteria-warn")
        .text("⚠ DO " + num + " mg/L melebihi batas maksimal " + DO_MAX_VALUE + " mg/L").show();
    }
  }

  //live re-check on manual edit, covers both #do_p (single) and #do_p_r0, #do_p_r1, ... (repeater)
  $(document).on("input change", "[id^='do_p']", function() {
    updateDoBadge(this.id.replace("do_p", ""));
  });

  function renderDocPreview(url, isPdf) {
    $("#doc-preview-empty").hide();
    $("#doc-preview-wrapper").show();
    if (isPdf) {
      $("#doc-preview").html('<iframe src="' + url + '"></iframe>');
    } else {
      $("#doc-preview").html('<img src="' + url + '">');
    }
  }

  function clearDocPreview() {
    if (currentDocBlobUrl) {
      URL.revokeObjectURL(currentDocBlobUrl);
      currentDocBlobUrl = null;
    }
    $("#doc-preview").html("");
    $("#doc-preview-wrapper").hide();
    $("#doc-preview-empty").show();
  }

  function showDropzoneFile(name) {
    $("#ocr-dropzone").addClass("has-file");
    $("#ocr-dropzone-placeholder").hide();
    $("#ocr-dropzone-filename").text(name);
    $("#ocr-dropzone-selected").show();
  }

  function resetDropzone() {
    $("#ocr-dropzone").removeClass("has-file dragover");
    $("#ocr-dropzone-selected").hide();
    $("#ocr-dropzone-placeholder").show();
  }

  $(document).on("dragover", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).addClass("dragover");
  });

  $(document).on("dragleave", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).removeClass("dragover");
  });

  $(document).on("drop", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).removeClass("dragover");
    var files = e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files;
    if (files && files.length) {
      $("#shu")[0].files = files;
      $("#shu").trigger("change");
    }
  });

  function setOcrStatus(type, html) {
    $("#ocr-status")
      .removeClass("alert-info alert-success alert-warning alert-danger")
      .addClass("alert-" + type)
      .html(html)
      .show();
  }

  //sfx = "" for the single/default fields, "_r0", "_r1", ... for cloned repeater rows
  function applyOcrResult(data, opts) {
    opts = opts || {};
    var sfx = opts.suffix || "";
    var done = opts.done;
    var unmatched = [];

    var lokasiDone = function() {
      if (typeof done === "function") {
        done();
      }
    };

    if (data.lokasi && data.lokasi.uid) {
      $.ajax({
        url: baseUrl + "ajax/lokasiById/x/" + data.lokasi.uid,
        method: "GET",
        success: function(r) {
          var htmls = "<option value=''>--PILIH LOKASI PEMANTAUAN--</option>";
          if (r.total) {
            jQuery.each(r.data, function(i, val) {
              htmls += "<option value='" + val.uid_lokasi_pemantauan + "' selected>" + val.kode_lokasi + " - " + val.alamat + " - " + val.alamat_detail + "</option>";
              $("#alamat" + sfx).val(val.alamat);
              $("#alamat_detail" + sfx).val(val.alamat_detail);
              $("#latitude" + sfx).val(val.latitude);
              $("#longitude" + sfx).val(val.longitude);
              renderKoordinatCheck(sfx, data.latitude, data.longitude, val.latitude, val.longitude);
              if (!sfx) {
                id_kabkota = val.uid_kabkota;
                $("#uid_provinsi").val(val.uid_provinsi).trigger("change");
                setTimeout(function() {
                  $("#uid_kabkota").val(val.uid_kabkota).trigger("change");
                }, 1000);
              }
            });
          } else {
            $("#cek-koordinat" + sfx).hide();
          }
          $("#uid_lokasi_pemantauan" + sfx).html(htmls);
          lokasiDone();
        },
        error: lokasiDone
      });
    } else {
      $("#cek-koordinat" + sfx).hide();
      if (data.lokasi && data.lokasi.text) {
        unmatched.push("Lokasi Pemantauan (\"" + data.lokasi.text + "\")");
      }
      lokasiDone();
    }

    if (data.peruntukan && data.peruntukan.uid) {
      $("#uid_rf_peruntukan" + sfx).val(data.peruntukan.uid).trigger("change");
    } else if (data.peruntukan && data.peruntukan.text) {
      unmatched.push("Peruntukan (\"" + data.peruntukan.text + "\")");
    }

    jQuery.each(["tss", "do_p", "minyak_dan_lemak", "amonia_total", "orto_fosfat"], function(i, id) {
      var nilai = data.parameters ? data.parameters[id] : undefined;
      if (nilai !== undefined && nilai !== null) {
        $("#" + id + sfx).val(nilai);
      }
    });
    updateDoBadge(sfx);
    if (data.unmatched_parameters && data.unmatched_parameters.length) {
      unmatched.push("Parameter lain terbaca di dokumen tapi tidak ada kolomnya di form: " + data.unmatched_parameters.join(", "));
    }

    return unmatched;
  }

  //tanggal/periode/lab are document-level (identical for every location in the same OCR result)
  function applySharedFields(data) {
    if (data.tanggal) {
      $("#tanggal").val(data.tanggal).trigger("change");
    }
    if (data.periode_pemantauan) {
      $("#periode_pemantauan").val(data.periode_pemantauan).trigger("change");
    }
    if (data.lab && data.lab.uid) {
      $("#uid_lab").val([String(data.lab.uid)]).trigger("change");
    }
  }

  //clone the <template>, suffix every id/for/to with _r{idx} so it can coexist with the single block
  function cloneOcrRowTemplate(idx) {
    var tpl = document.getElementById("ocr-row-template");
    var sfx = "_r" + idx;
    var $wrap = $("<div>").append(tpl.content.cloneNode(true));

    $wrap.find("[id]").each(function() {
      this.id = this.id + sfx;
    });
    $wrap.find("[for]").each(function() {
      $(this).attr("for", $(this).attr("for") + sfx);
    });
    $wrap.find("[to]").each(function() {
      $(this).attr("to", $(this).attr("to") + sfx);
    });

    return $wrap.children();
  }

  function renderOcrRepeaterRows() {
    $("#ocr-repeater-rows").empty();
    jQuery.each(ocrOptions, function(idx, opt) {
      var sfx = "_r" + idx;
      var $content = cloneOcrRowTemplate(idx);
      var $row = $('<div class="iku-row" data-idx="' + idx + '"></div>');
      var $header = $(
        '<div class="iku-row-header">'
        + '<p class="iku-row-title">Lokasi ' + (idx + 1) + ': ' + (opt.label || "-") + '</p>'
        + '<span class="iku-row-remove">Hapus dari batch</span>'
        + '</div>'
      );
      $row.append($header).append($content);
      $("#ocr-repeater-rows").append($row);

      $row.find(".select2").each(function() {
        $(this).select2({ dropdownParent: $(this).parent() });
      });

      $("#uid_lokasi_pemantauan" + sfx).on("change", function() {
        var valId = $(this).val();
        if (!valId) {
          $("#alamat" + sfx).val("");
          $("#alamat_detail" + sfx).val("");
          $("#latitude" + sfx).val("");
          $("#longitude" + sfx).val("");
          $("#cek-koordinat" + sfx).hide();
          return;
        }
        $.ajax({
          url: baseUrl + "ajax/lokasiById/x/" + valId,
          method: "GET",
          success: function(req) {
            if (req.total) {
              jQuery.each(req.data, function(i, val) {
                $("#alamat" + sfx).val(val.alamat);
                $("#alamat_detail" + sfx).val(val.alamat_detail);
                $("#latitude" + sfx).val(val.latitude);
                $("#longitude" + sfx).val(val.longitude);
                renderKoordinatCheck(sfx, opt.latitude, opt.longitude, val.latitude, val.longitude);
              });
            } else {
              $("#cek-koordinat" + sfx).hide();
            }
          }
        });
      });

      applyOcrResult(opt, { suffix: sfx });

      $row.find(".iku-row-remove").on("click", function() {
        $row.remove();
      });
    });
  }

  $(document).on("change", "#ocr-lokasi-picker", function() {
    var val = $(this).val();
    if (val === "all") {
      ocrMode = "all";
      $("#ocr-single-block").hide();
      $("#ocr-repeater-rows").show();
      renderOcrRepeaterRows();
      setOcrStatus("info", "Menampilkan " + ocrOptions.length + " lokasi sebagai form terpisah di bawah. Periksa/lengkapi tiap lokasi lalu klik Simpan untuk menyimpan semuanya sekaligus.");
    } else if (val !== "" && ocrOptions[val]) {
      ocrMode = "single";
      $("#ocr-repeater-rows").hide().empty();
      $("#ocr-single-block").show();
      var unmatched = applyOcrResult(ocrOptions[val]);
      var msg = "Lokasi \"" + (ocrOptions[val].label || "") + "\" diisikan ke form. Lokasi Pemantauan tetap bisa diganti manual di bawah.";
      if (unmatched.length) {
        setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
      } else {
        setOcrStatus("success", msg);
      }
    } else {
      ocrMode = null;
      $("#ocr-repeater-rows").hide().empty();
      $("#ocr-single-block").show();
    }
  });

  $(document).on("submit", "#tambahData form", function(event) {
    if (ocrMode !== "all") {
      return;
    }
    var $rows = $("#ocr-repeater-rows .iku-row");
    if (!$rows.length) {
      return;
    }
    event.preventDefault();

    var formEl = this;
    var total = $rows.length;
    var processed = 0;

    $("#btn-simpan-ikal").prop("disabled", true);

    function buildRowFormData(idx) {
      var sfx = "_r" + idx;
      var fd = new FormData(formEl);
      fd.set("submit", "1");
      //.set() replaces whatever the (hidden) single block's same-named fields captured
      fd.set("form[uid_lokasi_pemantauan]", $("#uid_lokasi_pemantauan" + sfx).val() || "");
      fd.set("form[uid_rf_peruntukan]", $("#uid_rf_peruntukan" + sfx).val() || "");
      fd.set("form[tss]", $("#tss" + sfx).val() || "");
      fd.set("form[do_p]", $("#do_p" + sfx).val() || "");
      fd.set("form[minyak_dan_lemak]", $("#minyak_dan_lemak" + sfx).val() || "");
      fd.set("form[amonia_total]", $("#amonia_total" + sfx).val() || "");
      fd.set("form[orto_fosfat]", $("#orto_fosfat" + sfx).val() || "");
      return fd;
    }

    function submitNext(i) {
      if (i >= $rows.length) {
        setOcrStatus("success", "Selesai memproses " + processed + " dari " + total + " lokasi. Halaman akan dimuat ulang...");
        setTimeout(function() {
          location.reload();
        }, 800);
        return;
      }
      var idx = $($rows.get(i)).data("idx");
      $("#btn-simpan-ikal").text("Menyimpan " + (i + 1) + "/" + total + "...");
      $.ajax({
        url: baseUrl + ctrl,
        method: "POST",
        data: buildRowFormData(idx),
        processData: false,
        contentType: false,
        complete: function() {
          processed++;
          submitNext(i + 1);
        }
      });
    }

    submitNext(0);
  });

  $(document).on("change", "#shu", function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) {
      $("#ocr-status").hide().html("");
      return;
    }

    if (currentDocBlobUrl) {
      URL.revokeObjectURL(currentDocBlobUrl);
    }
    currentDocBlobUrl = URL.createObjectURL(file);
    renderDocPreview(currentDocBlobUrl, file.type === "application/pdf");
    showDropzoneFile(file.name);
    ocrOptions = [];
    ocrMode = null;
    $("#ocr-multi-panel").hide();
    $("#ocr-repeater-rows").hide().empty();
    $("#ocr-single-block").show();

    if (file.size > 10 * 1024 * 1024) {
      setOcrStatus("danger", "Ukuran file melebihi 10 Mb, OCR dibatalkan. Silakan isi form manual.");
      return;
    }

    var fd = new FormData();
    fd.append("file", file);

    setOcrStatus("info", "Membaca dokumen, mohon tunggu...");
    $("#btn-simpan-ikal").prop("disabled", true).text("Membaca dokumen...");

    $.ajax({
      url: baseUrl + "ocr/ikalExtract",
      method: "POST",
      data: fd,
      processData: false,
      contentType: false,
      success: function(res) {
        try {
          res = (typeof res === "string") ? JSON.parse(res) : res;
        } catch (err) {
          res = { statusCode: 500, message: "Response OCR tidak valid" };
        }
        if (res.statusCode == 200) {
          if (res.data && res.data.multi) {
            ocrOptions = res.data.options || [];
            applySharedFields(ocrOptions[0] || {});

            var pickerHtml = '<option value="">--PILIH LOKASI--</option><option value="all">PILIH SEMUA</option>';
            jQuery.each(ocrOptions, function(i, opt) {
              pickerHtml += "<option value='" + i + "'>" + (opt.label || ("Lokasi " + (i + 1))) + "</option>";
            });
            $("#ocr-lokasi-picker").html(pickerHtml);
            $("#ocr-multi-panel").show();

            var matchedCount = 0;
            jQuery.each(ocrOptions, function(i, o) {
              if (o.lokasi && o.lokasi.uid) {
                matchedCount++;
              }
            });
            setOcrStatus("info", "Dokumen ini memuat " + ocrOptions.length + " lokasi pemantauan ("
              + matchedCount + " cocok otomatis). Pilih salah satu lokasi, atau \"PILIH SEMUA\" "
              + "untuk menampilkan semuanya sebagai form terpisah di bawah.");
          } else {
            $("#ocr-multi-panel").hide();
            ocrOptions = [];
            ocrMode = null;
            applySharedFields(res.data);
            var unmatched = applyOcrResult(res.data);
            var msg = "Dokumen berhasil dibaca, form terisi otomatis. Mohon periksa kembali sebelum menyimpan. "
              + "Catatan: parameter kualitas air (TSS/DO/Minyak &amp; Lemak/Amonia/Ortofosfat) belum didukung "
              + "OCR untuk IKAL, mohon isi manual.";
            if (unmatched.length) {
              setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
            } else {
              setOcrStatus("warning", msg);
            }
          }
        } else {
          setOcrStatus("danger", (res.message || "OCR gagal dibaca") + ". Silakan isi form manual.");
        }
      },
      error: function() {
        setOcrStatus("danger", "OCR gagal dihubungi. Silakan isi form manual.");
      },
      complete: function() {
        $("#btn-simpan-ikal").prop("disabled", false).text("Simpan");
      }
    });
  });

  $(document).ready(function() {
    $('#primary').on('show.bs.modal', function(event) {
      $(".select-year-indeks").val("").trigger("change");
      $(".simulasi-content").html("");
    });

    $(document).on("click", ".detail-data-simulasi", function() {
      var data_uid_p = $(this).attr("data-uid");
      var tahun = $(this).attr("tahun");
      $.ajax({
        url: baseUrl + "ajax/detailIkal/x/" + data_uid_p + "/t/" + tahun,
        method: "GET",
        success: function(req) {
          if (req.total) {
            var trDetail = "";

            req.data.forEach((val, i) => {
              var parameter = JSON.parse(val.json_data);
              trDetail += "<tr>" +
                "<td class='text-center'>" + (i + 1) + "</td>" +
                "<td class=''>" + val.alamat + " <br>" + val.alamat_detail + "</td>" +
                "<td class='text-center'>" + (parameter.subtotal.tss ? (parameter.subtotal.tss).toFixed(2) : parameter.subtotal.tss) + "</td>" +
                "<td class='text-center'>" + (parameter.subtotal.do_p ? (parameter.subtotal.do_p).toFixed(2) : parameter.subtotal.do_p) + "</td>" +
                "<td class='text-center'>" + (parameter.subtotal.minyak_dan_lemak ? (parameter.subtotal.minyak_dan_lemak).toFixed(2) : parameter.subtotal.minyak_dan_lemak) + "</td>" +
                "<td class='text-center'>" + (parameter.subtotal.amonia_total ? (parameter.subtotal.amonia_total).toFixed(2) : parameter.subtotal.amonia_total) + "</td>" +
                "<td class='text-center'>" + (parameter.subtotal.orto_fosfat ? (parameter.subtotal.orto_fosfat).toFixed(2) : parameter.subtotal.orto_fosfat) + "</td>" +
                "<td class='text-center'>" + (parameter.wqi ? (parameter.wqi).toFixed(2) : parameter.wqi) + "</td>" +
                "<td class='text-center'>" + (parameter.wqr ? parameter.wqr : parameter.wqr) + "</td>" +
                "</tr>";
            });
            $(".tbody-detail-" + data_uid_p).html(trDetail);
            $(".tr-detail-" + data_uid_p).show("slow");
          }
        }
      });
    });

    $(document).on("click", ".hide-detail-data-simulasi", function() {
      var data_uid_p = $(this).attr("data-uid");
      $(".tr-detail-" + data_uid_p).hide("slow");
      $(".tbody-detail-" + data_uid_p).html("");
    });

    $(document).on("click", "#btn-hitung-simulasi-prov", function(event) {
      var uid = $(this).attr("data-uid");
      if (uid) {
        $.ajax({
          url: baseUrl + "simulasiHitungIKAL/hitungProv/x/" + uid,
          method: "GET",
          success: function(request) {
            var res = JSON.parse(request);
            if (res.statusCode == 200) {
              if (res.data) {
                $(".nilai-indeks-" + uid + "-prov").html(Number(res.data.nilai_indeks).toFixed(2));
                $(".rating-indeks-" + uid + "-prov").html(res.data.rating_indeks);
                $(".detail-data-" + uid + "-simulasi").show();
              }
            }
          }
        });
      }
    });

    $(document).on("click", "#btn-hitung-simulasi-nasional", function(event) {
      var uid = $(this).attr("data-uid");
      if (uid) {
        $.ajax({
          url: baseUrl + "simulasiHitungIKAL/hitungNasional/x/" + uid,
          method: "GET",
          success: function(request) {
            var res = JSON.parse(request);
            if (res.statusCode == 200) {
              if (res.data) {
                $(".ikal-" + uid + "-nasional").html(res.data.toFixed(2));
              }
            }
          }
        });
      }
    });

    $(".select-year-indeks").on("change", function() {
      var year = $(this).val();
      if (year != "") {
        $.ajax({
          url: baseUrl + "simulasiHitungIKAL/getDataIndeks/x/" + year,
          method: "GET",
          success: function(req) {
            var res = JSON.parse(req);
            if (res.statusCode == 200) {
              var data = res;
              if (data) {
                $(".simulasi-content").html(data.html);
              }
            }
          }
        });
      }
    });
    setTimeout(function() {
      window.scrollTo(0, scrollTobtn);

            $("#amonia_total").val(req.amonia_total);

            $.ajax({
              url: baseUrl + "ajax/lokasiById/x/" + req.uid_lokasi_pemantauan,
              method: "GET",
              success: function(req) {
                var htmls = "<option value=''>--PILIH LOKASI PEMANTAUAN--</option>";
                if (req.total) {
                  jQuery.each(req.data, function(i, val) {
                    htmls += "<option value='" + val.uid_lokasi_pemantauan + "' selected>" + val.kode_lokasi + " - " + val.alamat + " - " + val.alamat_detail + "</option>";
                    $("#alamat").val(val.alamat);
                    $("#alamat_detail").val(val.alamat_detail);
                    $("#latitude").val(val.latitude);
                    $("#longitude").val(val.longitude);
                  });
                }
                $("#uid_lokasi_pemantauan").html(htmls);
              }
            });
            // $("#uid_lokasi_pemantauan").val(req.uid_lokasi_pemantauan).trigger("change");
            $("#periode_pemantauan").val(req.periode_pemantauan).trigger("change");
            $("#uid_rf_peruntukan").val(req.uid_rf_peruntukan).trigger("change");
            $("#uid_provinsi").val(req.uid_provinsi).trigger("change");

              var shuUrl = baseUrl + 'uploads/monitoring/' + req.shu;
              var htmlDownload = '<a title="Download File" class="border-secondary badge badge-dark round" href="' + shuUrl + '" target="_blank" >Download</a>'
              $(".shu-download").html(htmlDownload);
              $(".shu-download").show();
              renderDocPreview(shuUrl, /\.pdf$/i.test(req.shu));

  var maxLenghtText = 700;
  $(".catatan-verifikator").on('click', function() {
		$("#id-pelaporan").val("");
		$("#catatan-verifikator-txt").val("");
		$("#catatan-verifikator-select").val("").trigger("change");
    $("#catatan-verifikator-txt-length").html("Sudah terisi 0/"+maxLenghtText+" Karakter")
		var idPelaporan = $(this).attr("data-uid");
		$("#id-pelaporan").val(idPelaporan);
		if (idPelaporan) {
			$.ajax({
				url: baseUrl + ctrl + "/getCatatanVerifikasi/x/" + idPelaporan,
				method: "GET",
				success: function(request) {
					var req = JSON.parse(request);
					if (req.statusCode == 200) {
						$("#catatan-verifikator-txt").val(req.catatan).trigger("keyup");
						$("#catatan-verifikator-select").val(req.catatanSelect).trigger("change");
					}
				}
			});
		}
	});

  $("#catatan-verifikator-txt").on("keyup", function(){
		var val = $(this).val();
		var length_text = val.length;
		if(length_text > maxLenghtText){
			$("#catatan-verifikator-txt").val(val.substring(0,maxLenghtText));
      length_text = maxLenghtText;
		}
		$("#catatan-verifikator-txt-length").html("*Sudah terisi "+length_text+"/"+maxLenghtText+" Karakter")
	});

  $(".simpan-catatan-verifikator").on("click hide.bs.modal", function(event) {
		var idPelaporan = $("#id-pelaporan").val();
		var catatanVerifikatorTxt = $("#catatan-verifikator-txt").val();
		var catatanVerifikatorSelect = $("#catatan-verifikator-select").val();
		if (idPelaporan) {
			$.ajax({
				url: baseUrl + ctrl + "/catatanVerifikasi",
				method: "POST",
				data: JSON.stringify({
					uid: idPelaporan,
					catatan: catatanVerifikatorTxt,
					catatanSelect: catatanVerifikatorSelect,
				}),
				success: function(request) {
					if (request == 1) {
						$("#catatan-" + idPelaporan + "-short").html(catatanVerifikatorTxt+(catatanVerifikatorSelect?" "+catatanVerifikatorSelect:""));
					}
				}
			});
		}
	});
