    $(".open-detail").on("click", function(){
      var id = $(this).attr("id");

        embeded = '<div class="alert alert-danger text-center">TIDAK ADA SHU</div>';
      }else if (shu == 1) {
        embeded = '<div class="alert alert-warning text-center">FORMAT SHU BUKAN PDF | SILAHKAN DOWNLOAD SHU</div>';
      }else{
        embeded = '<iframe src="'+shu+'" style="width:100%; height:700px"></iframe>';
      }

      $(".tr_detail").hide();
      if(id != idOpen){
        idOpen = id;
        $("#tr-detail-"+id).show("slow");

        $("#shu-detail-"+id).html(embeded);
      }else{
        idOpen = 0;
      }
    });

<script type="text/javascript">
  function searchData(tableSrc, txtSrc) {
    if (tableSrc, txtSrc) {
      var input, filter, table, tr, td, i, txtValue;
      input = document.getElementById(txtSrc);
      filter = input.value.toUpperCase();
      table = document.getElementById(tableSrc);
      tr = table.getElementsByTagName("tr");
      for (i = 0; i < tr.length; i++) {
        td = tr[i].getElementsByTagName("td")[1];
        td2 = tr[i].getElementsByTagName("td")[2];
        if (td && td2) {
          txtValue = td.textContent || td.innerText;
          txtValue2 = td2.textContent || td2.innerText;
          if ((txtValue.toUpperCase().indexOf(filter) > -1) || txtValue2.toUpperCase().indexOf(filter) > -1) {
            tr[i].style.display = "";
          } else {
            tr[i].style.display = "none";
          }
        }
      }

    }

  }
</script>

  <script type="text/javascript">
  	$(".checked-status-prioritas").on("click", function(){
  		let prioritas = ["prioritas","kurang","tidak"];
  		let sx = $(this).attr("sx");
  		let sp = $(this).attr("sp");
  		$.ajax({
  			url: baseUrl + ctrl + "/indeksSetPrioritas/x/" + sx + "/p/" +sp,
  			method: "POST",
  			success: function(request) {
  				var req = JSON.parse(request);
  				if (req.statusCode == 200) {
  					prioritas.forEach((item, i) => {
  						$(".checked-"+item+"-"+sx).removeClass("bg-success");
  						$(".checked-"+item+"-"+sx).html("");
  					});

            if(req.prioritas){
              setTimeout(()=>{
                let lsp = sp.toLowerCase();
                $(".checked-"+lsp+"-"+sx).html("<h2><i class='ft-check'></i></h2>");
                $(".checked-"+lsp+"-"+sx).addClass("bg-success");
              },300);
            }

  				}
  			}
  		});
  	});
    $(".parameter_kritis").on("change", function(){
      let sx = $(this).attr("sx");
      let val = $(this).val();
      let parameter = "";
      if(val.length){
        parameter = val.join(",");
      }
      $.ajax({
  			url: baseUrl + ctrl + "/indeksSetParameter/x/" + sx + "/p/" + btoa(parameter),
  			method: "POST",
  			success: function(request) {
  				var req = JSON.parse(request);
  				if (req.statusCode == 200) {

  				}else{
            swal("Informasi","Gagal menyimpan data","warning");
          }
  			}
  		});
    })
  </script>
{/literal}
