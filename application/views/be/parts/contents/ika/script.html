<script type="text/javascript">
  var scrollTobtn = '{/literal}{$scrollTobtn}{literal}';
  var currentDocBlobUrl = null;
  var ocrOptions = [];
  var ocrMode = null; //null|"single"|"all"
  var IKA_PARAMS = ["debit","ph","bod","cod","tss","do_p","no3_n","total_phosphat","fecal_coliform",
    "kecerahan","klorofil_a","total_nitrogen","total_coliform","temperatur_air","temperatur_udara",
    "minyak_lemak","detergen_total","fenol","tds","sulfat","klorida","nitrit","amoniak","florida",
    "belerang_sbg_h2s","sianida","klorin_bebas","warna","sampah","ba","bo","hg","as_","se","fe","cd",
    "co","mn","ni","zn","cu","pb","cr_6","aldrin","bhc","chlordane","ddt","endrin","heptachlor",
    "lindane","methoxychlor","toxapan","radioaktivitas_gross_a","radioaktivitas_gross_b","e_coli"];

  function renderDocPreview(url, isPdf) {
    $("#doc-preview-empty").hide();
    $("#doc-preview-wrapper").show();
    if (isPdf) {
      $("#doc-preview").html('<iframe src="' + url + '"></iframe>');
    } else {
      $("#doc-preview").html('<img src="' + url + '">');
    }
  }

  function clearDocPreview() {
    if (currentDocBlobUrl) {
      URL.revokeObjectURL(currentDocBlobUrl);
      currentDocBlobUrl = null;
    }
    $("#doc-preview").html("");
    $("#doc-preview-wrapper").hide();
    $("#doc-preview-empty").show();
  }

  function showDropzoneFile(name) {
    $("#ocr-dropzone").addClass("has-file");
    $("#ocr-dropzone-placeholder").hide();
    $("#ocr-dropzone-filename").text(name);
    $("#ocr-dropzone-selected").show();
  }

  function resetDropzone() {
    $("#ocr-dropzone").removeClass("has-file dragover");
    $("#ocr-dropzone-selected").hide();
    $("#ocr-dropzone-placeholder").show();
  }

  $(document).on("dragover", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).addClass("dragover");
  });

  $(document).on("dragleave", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).removeClass("dragover");
  });

  $(document).on("drop", "#ocr-dropzone", function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(this).removeClass("dragover");
    var files = e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files;
    if (files && files.length) {
      $("#shu")[0].files = files;
      $("#shu").trigger("change");
    }
  });

  function setOcrStatus(type, html) {
    $("#ocr-status")
      .removeClass("alert-info alert-success alert-warning alert-danger")
      .addClass("alert-" + type)
      .html(html)
      .show();
  }

  function setBoxStatus($box, type, html) {
    $box.removeClass("alert-info alert-success alert-warning alert-danger")
      .addClass("alert-" + type)
      .html(html)
      .show();
  }

  //===== koordinat SHU (OCR) vs koordinat lokasi terdaftar, dengan toleransi jarak (sama seperti IKU) =====
  var KOORDINAT_TOLERANSI_OK_M = 50;
  var KOORDINAT_TOLERANSI_WARN_M = 100;

  function haversineMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000; //radius bumi, meter
    var toRad = function(d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  //sfx = "" for the single/default fields, "_r0", "_r1", ... for cloned repeater rows
  function renderKoordinatCheck(sfx, ocrLat, ocrLng, regLat, regLng) {
    var $box = $("#koordinat-check" + sfx);
    ocrLat = parseFloat(ocrLat);
    ocrLng = parseFloat(ocrLng);
    regLat = parseFloat(regLat);
    regLng = parseFloat(regLng);

    if (isNaN(ocrLat) || isNaN(ocrLng) || isNaN(regLat) || isNaN(regLng)) {
      $box.hide().html("");
      return;
    }

    var jarakLangsung = Math.round(haversineMeters(ocrLat, ocrLng, regLat, regLng));
    //sejumlah lokasi terdaftar diketahui punya kolom latitude/longitude tertukar (data entry lama) —
    //cek juga jarak seandainya keduanya ditukar, supaya tidak menampilkan selisih raksasa yang
    //menyesatkan padahal sebenarnya cuma tertukar (sama seperti IKU)
    var jarakTertukar = Math.round(haversineMeters(ocrLat, ocrLng, regLng, regLat));
    var koordDasar = "Koordinat SHU: " + ocrLat + ", " + ocrLng + " &middot; Terdaftar: " + regLat + ", " + regLng;

    if (jarakTertukar <= KOORDINAT_TOLERANSI_WARN_M && jarakTertukar < jarakLangsung * 0.5) {
      setBoxStatus($box, "warning", "<b>Latitude/Longitude lokasi terdaftar kemungkinan tertukar</b> &middot; " + koordDasar
        + " &middot; Selisih langsung ~" + jarakLangsung + " m, setelah ditukar ~" + jarakTertukar + " m"
        + " &middot; Mohon periksa &amp; perbaiki data Lokasi Pemantauan.");
      return;
    }

    var jarak = Math.min(jarakLangsung, jarakTertukar);
    var type = "danger";
    var label = "Koordinat SHU tidak sesuai lokasi terdaftar";
    if (jarak <= KOORDINAT_TOLERANSI_OK_M) {
      type = "success";
      label = "Koordinat SHU sesuai lokasi terdaftar";
    } else if (jarak <= KOORDINAT_TOLERANSI_WARN_M) {
      type = "warning";
      label = "Koordinat SHU perlu diperiksa";
    }
    var catatanTertukar = (jarakTertukar < jarakLangsung)
      ? " &middot; (jarak setelah ditukar lebih dekat: ~" + jarakTertukar + " m, kemungkinan lat/long lokasi terdaftar tertukar)"
      : "";

    setBoxStatus($box, type, "<b>" + label + "</b> &middot; " + koordDasar + " &middot; Selisih ~" + jarak + " m" + catatanTertukar);
  }

  function toggleKategoriFields($scope, val) {
    var $fields = $scope.find(".danau_parameter");
    if (val == 3) {
      $fields.show();
    } else {
      $fields.hide();
    }
  }

  //sfx = "" for the single/default fields, "_r0", "_r1", ... for cloned repeater rows.
  //Unlike IKU/IKAL, IKA's OCR result carries tanggal PER LOCATION (not document-level), so it's
  //set here per-suffix rather than via applySharedFields.
  function applyOcrResult(data, opts) {
    opts = opts || {};
    var sfx = opts.suffix || "";
    var done = opts.done;
    var unmatched = [];

    if (data.tanggal) {
      $("#tanggal" + sfx).val(data.tanggal).trigger("change");
    }

    var lokasiDone = function() {
      if (typeof done === "function") {
        done();
      }
    };

    if (data.lokasi && data.lokasi.uid) {
      $.ajax({
        url: baseUrl + "ajax/lokasiById/x/" + data.lokasi.uid,
        method: "GET",
        success: function(r) {
          var htmls = "<option value=''>--PILIH LOKASI PEMANTAUAN--</option>";
          if (r.total) {
            jQuery.each(r.data, function(i, val) {
              htmls += "<option value='" + val.uid_lokasi_pemantauan + "' selected>" + val.kode_lokasi + " - " + val.alamat + " - " + val.alamat_detail + "</option>";
              $("#alamat" + sfx).val(val.alamat);
              $("#alamat_detail" + sfx).val(val.alamat_detail);
              $("#latitude" + sfx).val(val.latitude);
              $("#longitude" + sfx).val(val.longitude);
              renderKoordinatCheck(sfx, data.latitude, data.longitude, val.latitude, val.longitude);
              if (!sfx) {
                id_kabkota = val.uid_kabkota;
                $("#uid_provinsi").val(val.uid_provinsi).trigger("change");
                setTimeout(function() {
                  $("#uid_kabkota").val(val.uid_kabkota).trigger("change");
                }, 1000);
              }
            });
          } else {
            $("#koordinat-check" + sfx).hide();
          }
          $("#uid_lokasi_pemantauan" + sfx).html(htmls);
          lokasiDone();
        },
        error: lokasiDone
      });
    } else {
      $("#koordinat-check" + sfx).hide();
      if (data.lokasi && data.lokasi.text) {
        unmatched.push("Lokasi Pemantauan (\"" + data.lokasi.text + "\")");
      }
      lokasiDone();
    }

    if (data.kategori && data.kategori.value) {
      $("#kategori" + sfx).val(data.kategori.value).trigger("change");
    } else if (data.kategori && data.kategori.text) {
      unmatched.push("Kategori (\"" + data.kategori.text + "\")");
    }

    jQuery.each(IKA_PARAMS, function(i, id) {
      var val = data.parameters ? data.parameters[id] : undefined;
      if (val !== undefined && val !== null) {
        $("#" + id + sfx).val(val);
      }
    });

    if (data.unmatched_parameters && data.unmatched_parameters.length) {
      unmatched.push("Parameter lain yang terbaca tapi belum bisa dipetakan otomatis: " + data.unmatched_parameters.join(", "));
    }

    return unmatched;
  }

  //periode_pemantauan/laboratorium are document-level (identical for every location in one OCR result)
  function applySharedFields(data) {
    if (data.periode_pemantauan) {
      $("#periode_pemantauan").val(data.periode_pemantauan).trigger("change");
    }
    if (data.lab && data.lab.uid) {
      $("#uid_lab").val([String(data.lab.uid)]).trigger("change");
    }
  }

  //clone the <template>, suffix every id/for/to with _r{idx} so it can coexist with the single block
  function cloneOcrRowTemplate(idx) {
    var tpl = document.getElementById("ocr-row-template");
    var sfx = "_r" + idx;
    var $wrap = $("<div>").append(tpl.content.cloneNode(true));

    $wrap.find("[id]").each(function() {
      this.id = this.id + sfx;
    });
    $wrap.find("[for]").each(function() {
      $(this).attr("for", $(this).attr("for") + sfx);
    });
    $wrap.find("[to]").each(function() {
      $(this).attr("to", $(this).attr("to") + sfx);
    });

    return $wrap.children();
  }

  function renderOcrRepeaterRows() {
    $("#ocr-repeater-rows").empty();
    jQuery.each(ocrOptions, function(idx, opt) {
      var sfx = "_r" + idx;
      var $content = cloneOcrRowTemplate(idx);
      var $row = $('<div class="iku-row" data-idx="' + idx + '"></div>');
      var $header = $(
        '<div class="iku-row-header">'
        + '<p class="iku-row-title">Lokasi ' + (idx + 1) + ': ' + (opt.label || "-") + '</p>'
        + '<span class="iku-row-remove">Hapus dari batch</span>'
        + '</div>'
      );
      $row.append($header).append($content);
      $("#ocr-repeater-rows").append($row);

      $row.find(".select2").each(function() {
        $(this).select2({ dropdownParent: $(this).parent() });
      });

      $("#uid_lokasi_pemantauan" + sfx).on("change", function() {
        var valId = $(this).val();
        if (!valId) {
          $("#alamat" + sfx).val("");
          $("#alamat_detail" + sfx).val("");
          $("#latitude" + sfx).val("");
          $("#longitude" + sfx).val("");
          $("#koordinat-check" + sfx).hide().html("");
          return;
        }
        $.ajax({
          url: baseUrl + "ajax/lokasiById/x/" + valId,
          method: "GET",
          success: function(req) {
            if (req.total) {
              jQuery.each(req.data, function(i, val) {
                $("#alamat" + sfx).val(val.alamat);
                $("#alamat_detail" + sfx).val(val.alamat_detail);
                $("#latitude" + sfx).val(val.latitude);
                $("#longitude" + sfx).val(val.longitude);
                renderKoordinatCheck(sfx, opt.latitude, opt.longitude, val.latitude, val.longitude);
              });
            }
          }
        });
      });

      $("#kategori" + sfx).on("change", function() {
        toggleKategoriFields($row, $(this).val());
      });

      applyOcrResult(opt, { suffix: sfx });

      $row.find(".iku-row-remove").on("click", function() {
        $row.remove();
      });
    });
  }

  $(document).on("change", "#ocr-lokasi-picker", function() {
    var val = $(this).val();
    if (val === "all") {
      ocrMode = "all";
      $("#ocr-single-block").hide();
      $("#ocr-repeater-rows").show();
      renderOcrRepeaterRows();
      setOcrStatus("info", "Menampilkan " + ocrOptions.length + " lokasi sebagai form terpisah di bawah. Periksa/lengkapi tiap lokasi lalu klik Simpan untuk menyimpan semuanya sekaligus.");
    } else if (val !== "" && ocrOptions[val]) {
      ocrMode = "single";
      $("#ocr-repeater-rows").hide().empty();
      $("#ocr-single-block").show();
      var unmatched = applyOcrResult(ocrOptions[val]);
      var msg = "Lokasi \"" + (ocrOptions[val].label || "") + "\" diisikan ke form. Lokasi Pemantauan tetap bisa diganti manual di bawah.";
      if (unmatched.length) {
        setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
      } else {
        setOcrStatus("success", msg);
      }
    } else {
      ocrMode = null;
      $("#ocr-repeater-rows").hide().empty();
      $("#ocr-single-block").show();
    }
  });

  $(document).on("submit", "#tambahData form", function(event) {
    if (ocrMode !== "all") {
      return;
    }
    var $rows = $("#ocr-repeater-rows .iku-row");
    if (!$rows.length) {
      return;
    }
    event.preventDefault();

    var formEl = this;
    var total = $rows.length;
    var processed = 0;

    $("#btn-simpan-ika").prop("disabled", true);

    function buildRowFormData(idx) {
      var sfx = "_r" + idx;
      var fd = new FormData(formEl);
      fd.set("submit", "1");
      //.set() replaces whatever the (hidden) single block's same-named fields captured
      fd.set("form[tanggal]", $("#tanggal" + sfx).val() || "");
      fd.set("form[uid_lokasi_pemantauan]", $("#uid_lokasi_pemantauan" + sfx).val() || "");
      fd.set("form[kategori]", $("#kategori" + sfx).val() || "");
      jQuery.each(IKA_PARAMS, function(i, id) {
        fd.set("form[" + id + "]", $("#" + id + sfx).val() || "");
      });
      return fd;
    }

    function submitNext(i) {
      if (i >= $rows.length) {
        setOcrStatus("success", "Selesai memproses " + processed + " dari " + total + " lokasi. Halaman akan dimuat ulang...");
        setTimeout(function() {
          location.reload();
        }, 800);
        return;
      }
      var idx = $($rows.get(i)).data("idx");
      $("#btn-simpan-ika").text("Menyimpan " + (i + 1) + "/" + total + "...");
      $.ajax({
        url: baseUrl + ctrl,
        method: "POST",
        data: buildRowFormData(idx),
        processData: false,
        contentType: false,
        complete: function() {
          processed++;
          submitNext(i + 1);
        }
      });
    }

    submitNext(0);
  });

  $(document).on("change", "#shu", function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) {
      $("#ocr-status").hide().html("");
      return;
    }

    if (currentDocBlobUrl) {
      URL.revokeObjectURL(currentDocBlobUrl);
    }
    currentDocBlobUrl = URL.createObjectURL(file);
    renderDocPreview(currentDocBlobUrl, file.type === "application/pdf");
    showDropzoneFile(file.name);
    ocrOptions = [];
    ocrMode = null;
    $("#ocr-multi-panel").hide();
    $("#ocr-repeater-rows").hide().empty();
    $("#ocr-single-block").show();

    if (file.size > 10 * 1024 * 1024) {
      setOcrStatus("danger", "Ukuran file melebihi 10 Mb, OCR dibatalkan. Silakan isi form manual.");
      return;
    }

    var fd = new FormData();
    fd.append("file", file);

    setOcrStatus("info", "Membaca dokumen, mohon tunggu...");
    $("#btn-simpan-ika").prop("disabled", true).text("Membaca dokumen...");

    $.ajax({
      url: baseUrl + "ocr/ikaExtract",
      method: "POST",
      data: fd,
      processData: false,
      contentType: false,
      success: function(res) {
        try {
          res = (typeof res === "string") ? JSON.parse(res) : res;
        } catch (err) {
          res = { statusCode: 500, message: "Response OCR tidak valid" };
        }
        if (res.statusCode == 200) {
          if (res.data && res.data.multi) {
            ocrOptions = res.data.options || [];
            applySharedFields(ocrOptions[0] || {});

            var pickerHtml = '<option value="">--PILIH LOKASI--</option><option value="all">PILIH SEMUA</option>';
            jQuery.each(ocrOptions, function(i, opt) {
              pickerHtml += "<option value='" + i + "'>" + (opt.label || ("Lokasi " + (i + 1))) + "</option>";
            });
            $("#ocr-lokasi-picker").html(pickerHtml);
            $("#ocr-multi-panel").show();

            var matchedCount = 0;
            jQuery.each(ocrOptions, function(i, o) {
              if (o.lokasi && o.lokasi.uid) {
                matchedCount++;
              }
            });
            setOcrStatus("info", "Dokumen ini memuat " + ocrOptions.length + " lokasi pemantauan ("
              + matchedCount + " cocok otomatis). Pilih salah satu lokasi, atau \"PILIH SEMUA\" "
              + "untuk menampilkan semuanya sebagai form terpisah di bawah.");
          } else {
            $("#ocr-multi-panel").hide();
            ocrOptions = [];
            ocrMode = null;
            applySharedFields(res.data);
            var unmatched = applyOcrResult(res.data);
            var msg = "Dokumen berhasil dibaca, form terisi otomatis. Mohon periksa kembali sebelum menyimpan.";
            if (unmatched.length) {
              setOcrStatus("warning", msg + "<br>Tidak dapat dicocokkan otomatis, mohon isi manual: " + unmatched.join(", "));
            } else {
              setOcrStatus("success", msg);
            }
          }
        } else {
          setOcrStatus("danger", (res.message || "OCR gagal dibaca") + ". Silakan isi form manual.");
        }
      },
      error: function() {
        setOcrStatus("danger", "OCR gagal dihubungi. Silakan isi form manual.");
      },
      complete: function() {
        $("#btn-simpan-ika").prop("disabled", false).text("Simpan");
      }
    });
  });

  $(document).ready(function() {
    $('#exportTitik').on("click", function(){
      TableToExcel.convert(document.getElementById("titik"), {
        name: "Titik.xlsx",
        sheet: {
          name: "Sheet 1"
        }
      });
    });

    $('.show-titik').on("click", function() {
      var name = $(this).attr('data-nama');
      var uid = $(this).attr('data-uid');
      // alert(name);
      $('#body-data').html('<tr><td colspan="6" class="text-center">...wait a moment...</td></tr>');
      $('#data-nama').text('Titik Lokasi - '+name);
      $('#data-nama-daerah').text(name);

      $.ajax({
        url: baseUrl + ctrl + "/titikLokasi/uid/" + uid,
        method: "GET",
        success: function(req) {
          $('#body-data').html(req);
        }
      });
    });

    $('#primary').on('show.bs.modal', function(event) {
      $(".select-year-indeks").val("").trigger("change");
      $(".simulasi-content").html("");
    });

    var idOpen = 0;
    $(".open-detail").on("click", function(){
      var id = $(this).attr("id");
      var shu = $(this).attr("shu");
      var embeded = "";
      if(shu == 0){
        embeded = '<div class="alert alert-danger text-center">TIDAK ADA SHU</div>';
      }else if (shu == 1) {
        embeded = '<div class="alert alert-warning text-center">FORMAT SHU BUKAN PDF | SILAHKAN DOWNLOAD SHU</div>';
      }else{
        embeded = '<iframe src="'+shu+'" style="width:100%; height:700px"></iframe>';
      }

      $(".tr_detail").hide();
      if(id != idOpen){
        idOpen = id;
        $("#tr-detail-"+id).show("slow");

        $("#shu-detail-"+id).html(embeded);
      }else{
        idOpen = 0;
      }
    });

    $(document).on("click", "#btn-hitung-simulasi-kabkota", function(event) {
      var uid = $(this).attr("data-uid");
      if (uid) {
        $.ajax({
          url: baseUrl + "simulasiHitungIKA/hitung/x/" + uid + "/y/1",
          method: "GET",
          success: function(request) {
            var res = JSON.parse(request);
            if (res.statusCode == 200) {
              if (res.data) {
                $(".jumlah-titik-memenuhi-" + uid + "-kabkota").html(res.data.jumlah_titik_memenuhi);
                $(".jumlah-titik-ringan-" + uid + "-kabkota").html(res.data.jumlah_titik_ringan);
                $(".jumlah-titik-sedang-" + uid + "-kabkota").html(res.data.jumlah_titik_sedang);
                $(".jumlah-titik-berat-" + uid + "-kabkota").html(res.data.jumlah_titik_berat);
                $(".nilai-mutu-memenuhi-" + uid + "-kabkota").html((res.data.nilai_mutu_memenuhi ? res.data.nilai_mutu_memenuhi.toFixed(2) : res.data.nilai_mutu_memenuhi));
                $(".nilai-mutu-ringan-" + uid + "-kabkota").html((res.data.nilai_mutu_ringan ? res.data.nilai_mutu_ringan.toFixed(2) : res.data.nilai_mutu_ringan));
                $(".nilai-mutu-sedang-" + uid + "-kabkota").html((res.data.nilai_mutu_sedang ? res.data.nilai_mutu_sedang.toFixed(2) : res.data.nilai_mutu_sedang));
                $(".nilai-mutu-berat-" + uid + "-kabkota").html((res.data.nilai_mutu_berat ? res.data.nilai_mutu_berat.toFixed(2) : res.data.nilai_mutu_berat));
                $(".nilai-indeks-" + uid + "-kabkota").html((res.data.nilai_indeks ? res.data.nilai_indeks.toFixed(2) : res.data.nilai_indeks));

                $(".nilai-indeks-ina-" + uid + "-kabkota").html((res.data.nilai_indeks_ina ? res.data.nilai_indeks_ina.toFixed(2) : res.data.nilai_indeks_ina));
                $(".nilai-indeks-ina-mutu-" + uid + "-kabkota").html(res.data.nilai_indeks_ina_mutu);
              }
            }
          }
        });
      }
    });

    $(document).on("click", "#btn-hitung-simulasi-prov", function(event) {
      var uid = $(this).attr("data-uid");
      if (uid) {
        $.ajax({
          url: baseUrl + "simulasiHitungIKA/hitung/x/" + uid + "/y/2",
          method: "GET",
          success: function(request) {
            var res = JSON.parse(request);
            if (res.statusCode == 200) {

              url: baseUrl + "ajax/lokasiById/x/" + req.uid_lokasi_pemantauan,
              method: "GET",
              success: function(req) {
                var htmls = "<option value=''>--PILIH LOKASI PEMANTAUAN--</option>";

	});
