<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # -----------------------------------------------------------------------
    # `assets` di repo adalah symlink Unix ke application/views/be/assets.
    # Symlink itu tidak terbawa utuh ke semua host (di Windows ter-checkout
    # sebagai file teks, atau diakali dengan directory junction). Alias ini
    # memetakan URL /assets/... langsung ke sumber aslinya, sehingga container
    # sama sekali tidak bergantung pada symlink tersebut.
    # -----------------------------------------------------------------------
    Alias /assets/ /var/www/html/application/views/be/assets/

    <Directory /var/www/html/application/views/be/assets/>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /var/www/html>
        # AllowOverride All wajib: rewrite rule aplikasi ada di .htaccess repo,
        # bukan di file ini.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    # Jangan sajikan direktori yang tidak boleh diakses publik.
    #
    # Ini bukan hardening teoretis: rewrite rule di .htaccess meneruskan request
    # ke index.php HANYA kalau file-nya tidak ada. File .php yang benar-benar ada
    # di path tersebut akan dieksekusi Apache secara langsung, di luar alur
    # controller — termasuk template hasil kompilasi Smarty di temp/.
    <DirectoryMatch "^/var/www/html/(config|kick|libs|temp|application/(controllers|models|prompts))">
        Require all denied
    </DirectoryMatch>

    # Teruskan variabel dari docker-compose ke lingkungan PHP, supaya
    # getenv() di config/globalsetting.php dan config/apikeys.php melihatnya
    # meskipun file .env tidak ada di dalam container.
    PassEnv DB_DRIVER DB_SERVER DB_USER DB_PASS DB_NAME
    PassEnv BASE_URL
    PassEnv OPENROUTER_API_KEY OPENROUTER_OCR_MODEL OPENROUTER_API_URL

    # Log ke stdout/stderr supaya terbaca lewat `docker compose logs`
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
