; Konfigurasi PHP untuk SITALA.
; Di-mount sebagai /usr/local/etc/php/conf.d/sitala.ini

; ---------------------------------------------------------------------------
; Upload
;
; ocrController::readUploadedFile() menerima dokumen sampai 10 MB. Default PHP
; hanya upload_max_filesize=2M, jadi tanpa penyesuaian ini fitur OCR menolak
; sebagian besar file yang sah.
; ---------------------------------------------------------------------------
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 40

; ---------------------------------------------------------------------------
; Batas eksekusi
;
; Export Excel/PDF berjalan pada dataset besar (LIMIT_DOWNLOAD_EXCEL = 2500,
; LIMIT_INDEKS = 600), dan OCR memanggil OpenRouter dengan timeout cURL 90 detik.
; ---------------------------------------------------------------------------
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
default_socket_timeout = 120

date.timezone = Asia/Jakarta

; ---------------------------------------------------------------------------
; Error
;
; index.php menyetel error_reporting(E_ALL) dan display_errors=FALSE saat runtime,
; jadi nilai di sini tidak menghentikan derasnya PHP Deprecated dari ADOdb dan
; Smarty di log. Yang penting: error tetap tercatat dan terbaca lewat
; `docker compose logs`, bukan bocor ke browser.
; ---------------------------------------------------------------------------
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off
